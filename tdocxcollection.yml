  /api/webhooks/signature/deliveries:
    get:
      tags:
        - Webhooks
      summary: List Webhook Deliveries
      description: >-
        List historical delivery attempts for the org's signature webhook. Supports pagination and
        filtering by event type, delivery status, and HTTP response code.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          description: Number of records to return. Default 20.
          example: '20'
        - name: offset
          in: query
          schema:
            type: integer
          description: Number of records to skip for pagination.
          example: '0'
        - name: eventType
          in: query
          schema:
            type: string
          description: Filter by event type.
          example: signature.document.completed
        - name: isDelivered
          in: query
          schema:
            type: boolean
            enum:
              - true
              - false
          description: Filter by delivery success.
          example: 'true'
        - name: httpStatus
          in: query
          schema:
            type: integer
          description: Filter by HTTP response status code.
          example: '200'
      responses:
        '200':
          description: >-
            `status` summarizes the row as `"delivered"`, `"failed"` (all `maxAttempts` attempts
            exhausted), `"retrying"`, or `"pending"`. Failed deliveries retry automatically with
            backoff (immediate, then +1 minute, then +5 minutes) for up to `maxAttempts` (3)
            attempts total before landing in the dead-letter state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        webhookId:
                          type: string
                        eventType:
                          type: string
                        payload:
                          type: object
                        httpStatus:
                          type: integer
                          nullable: true
                        isDelivered:
                          type: boolean
                        attemptCount:
                          type: integer
                        deliveredAt:
                          type: string
                          format: date-time
                          nullable: true
                        createdOn:
                          type: string
                          format: date-time
                  totalRecords:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
              example:
                data:
                  results:
                    - id: d3a1c2b4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      eventType: signature.document.completed
                      url: https://example.com/webhooks/turbodocx
                      httpStatus: 502
                      responseBody: Bad Gateway
                      attemptCount: 2
                      maxAttempts: 3
                      isDelivered: false
                      deliveredAt: null
                      nextRetryAt: '2026-05-02T09:15:00.000Z'
                      errorMessage: Request failed with status code 502
                      status: retrying
                      createdOn: '2026-05-02T09:05:00.000Z'
                      updatedOn: '2026-05-02T09:10:00.000Z'
                  totalRecords: 1
                  limit: 20
                  offset: 0
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator. The response has no body.
        '404':
          description: >-
            No webhook with that name exists in your organization. Response body: `{ "error":
            "Webhook not found" }`
          content:
            application/json: {}
      x-codeSamples:
        - lang: NodeJs
          label: SDK
          source: >
