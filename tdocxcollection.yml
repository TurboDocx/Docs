          required: true
          description: The deliverable ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 255
                  description: New name.
                description:
                  type: string
                  maxLength: 65535
                  nullable: true
                  description: New description.
                deliverableFolderId:
                  type: string
                  format: uuid
                  description: Folder to move the deliverable to.
                tags:
                  type: array
                  maxItems: 50
                  description: >-
                    The full list of tag labels (1 to 255 characters each). Replaces the existing
                    tags.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                defaultFont:
                  type: string
                  nullable: true
                  description: Default font for the deliverable.
                fonts:
                  type: array
                  description: Fonts used by the document. Each entry has exactly `name` and `usage`.
                  items:
                    type: object
                    required:
                      - name
                      - usage
                    properties:
                      name:
                        type: string
                      usage:
                        type: string
            example:
              name: Employee Contract - John Smith (Final)
              tags:
                - hr
                - contract
                - finalized
      responses:
        '200':
          description: The deliverable was updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                      deliverableId:
                        type: string
                        format: uuid
              example:
                data:
                  message: Deliverable updated successfully
                  deliverableId: 39697685-ca00-43b8-92b8-7722544c574f
        '400':
          description: '`id` is not a valid UUID, or the body is invalid (for example it includes `id`).'
          content:
            application/json:
              example:
                message: There was an issue validating the body
                type: ValidationError
                data:
                  errors:
                    - message: '"name" length must be at least 3 characters long'
                      path:
                        - name
                      type: string.min
                      context:
                        limit: 3
                        value: ab
                        label: name
                        key: name
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                limit:
                                  type: integer
                                value:
                                  type: string
                                label:
