  /turbosign/documents/{documentId}/void:
    post:
      tags:
        - TurboSign
      summary: Void Document
      description: >-
        Cancels a signature document so it can no longer be signed, and records your reason in the
        audit trail. A document that is already voided or has expired cannot be voided.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
                  description: Why the document is being voided. Recorded in the audit trail.
                  example: Terms changed; a new version will be sent.
      responses:
        '200':
          description: The document was voided.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      name:
                        type: string
                      status:
                        type: string
                        example: voided
                      voidReason:
                        type: string
                      voidedAt:
                        type: string
                        format: date-time
              example:
                data:
                  id: 4a20eca5-7944-430c-97d5-fcce4be24296
                  name: Service Agreement
                  status: voided
                  voidReason: Terms changed; a new version will be sent.
                  voidedAt: '2026-01-17T09:12:00.000Z'
        '400':
          description: >-
            `reason` is missing or too long, or the document cannot be voided (`DocumentVoided`,
            `DocumentExpired`, `DocumentNotVoidable`).
          content:
            application/json:
              examples:
                validation:
                  summary: Missing reason
                  value:
                    message: There was an issue validating the body
                    type: ValidationError
                    data:
                      errors:
                        - message: Void reason is required
                          path:
                            - reason
                          type: any.required
                          context:
                            label: reason
                            key: reason
                alreadyVoided:
                  summary: Already voided
                  value:
                    error: Document has been voided and cannot be voided again
                    code: DocumentVoided
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                label:
                                  type: string
                                key:
                                  type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: The key's role cannot void documents (viewers cannot). The response has no body.
        '404':
          description: The document does not exist, was deleted, or belongs to another organization.
          content:
            application/json:
              example:
                error: Document not found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to void document
              schema:
                type: object
                properties:
                  error:
                    type: string
