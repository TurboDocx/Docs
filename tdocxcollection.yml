  /turbosign/embedded-signing-settings:
    get:
      tags:
        - Embedded Signing
      summary: Get Embedded Signing Settings
      description: >-
        Returns what your organization allows for embedded signing and identity verification, so
        your integration can check before it sends or requests a signing URL. It is read-only; an
        administrator changes these settings in TurboDocx.
      responses:
        '200':
          description: Your organization's embedded signing settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          enabled:
                            type: boolean
                            description: Embedded signing and identity verification are on.
                          allowExternalIdv:
                            type: boolean
                            description: You may verify signers with your own provider (`external_idv`).
                          allowIdentityOverride:
                            type: boolean
                            description: A sender may issue a link that skips verification (`override`).
                          defaultChannel:
                            type: string
                            enum:
                              - none
                              - email
                              - sms
                            description: >-
                              Passcode channel for recipients that do not set one. `none` means only
                              when requested.
                          allowChannelOverride:
                            type: boolean
                            description: Whether a request may set a channel other than `defaultChannel`.
                          allowedFrameAncestors:
                            type: array
                            description: >-
                              Origins allowed to show the signing page in an iframe. Empty denies
                              all framing.
                            items:
                              type: string
              example:
                data:
                  results:
                    enabled: true
                    allowExternalIdv: true
                    allowIdentityOverride: false
                    defaultChannel: email
                    allowChannelOverride: false
                    allowedFrameAncestors:
                      - https://app.example.com
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
      x-codeSamples:
        - lang: NodeJs
          label: SDK
          source: |
            import { TurboSign } from '@turbodocx/sdk';

            TurboSign.configure({
              apiKey: process.env.TURBODOCX_API_KEY,
              orgId: process.env.TURBODOCX_ORG_ID,
              senderEmail: 'sender@example.com',
              senderName: 'Your Company',
            });

            const settings = await TurboSign.getEmbeddedSigningSettings();
            console.log(settings);
        - lang: Python
          label: SDK
          source: |
            import asyncio
            import os

            from turbodocx_sdk import TurboSign

            TurboSign.configure(
                api_key=os.environ["TURBODOCX_API_KEY"],
                org_id=os.environ["TURBODOCX_ORG_ID"],
                sender_email="sender@example.com",
                sender_name="Your Company",
            )


            async def main():
                settings = await TurboSign.get_embedded_signing_settings()
