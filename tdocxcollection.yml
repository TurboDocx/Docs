openapi: 3.0.0
info:
  title: TurboDocx API Documentation
  description: >-
    Welcome to the TurboDocx API Documentation. This comprehensive guide is designed to provide
    developers with all the information required to interact with the TurboDocx platform
    programmatically.


    Whether you're looking to automate document creation, manage your templates, or integrate
    TurboDocx features into your application, you'll find the necessary endpoints, parameters, and
    examples here.


    ## **Getting started guide**


    Before diving into the specifics of the API, ensure that you have obtained the necessary Access
    Token and have the correct permissions to access the desired resources.


    Keep your Access Token secure and do not expose them in publicly accessible areas such as
    GitHub, client-side code, etc. **The Authentication and Organization ID is a variable set at the
    root of the collection.**


    ## Base URL


    All API requests should be made to the base URL provided upon your API key registration.
    Typically, it looks like this:


    ``` typescript

    https://api.turbodocx.com

     ```

    ## Authentication


    TurboDocx is working on it's API Key flows, and for the time being, we recommend grabbing the
    access token used from your user's accounts to leverage our APIs. You can find an example on how
    to get your access token in the `Blueprint` folder.


    To use the Access Token, use the following under the `Authorization Header`


    ``` typescript

    Authorization: Bearer YOUR_ACCESS_TOKEN

     ```

    ### Authentication error response


    If an Access Token is missing, malformed, or invalid, you will receive an HTTP 401 Unauthorized
    response code.


    ### **Need some help?**


    In case you have questions, go through our tutorials ((link to your video or help documentation
    here)). Or visit our FAQ page ((link to the relevant page)).


    Or you can check out our community forum, there’s a good chance our community has an answer for
    you. Visit our developer forum ((link to developer forum)) to review topics, ask questions, and
    learn from others.


    `You can also document or add links to libraries, code examples, and other resources needed to
    make a request.`
  version: 1.0.0
servers:
  - url: https://api.turbodocx.com
    description: Production
tags:
  - name: Templates
  - name: Variables
  - name: Tags
  - name: Deliverables
  - name: TurboSign
  - name: Bulk Signatures
  - name: Embedded Signing
  - name: Webhooks
  - name: Account
paths:
  /Variable:
    post:
      tags:
        - Variables
      summary: Create Image Variable (Folder)
      description: >-
        Create a reusable image, text, or HTML variable in a template folder or your knowledge base.
        Includes example request, response, and error handling.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the variable
                description:
                  type: string
                  description: The description of the variable
                tags:
                  type: array
                  items:
                    type: string
                  description: List of tags associated with the variable
                placeholder:
                  type: string
                  description: >-
                    A unique placeholder text that is used to insert the variable content into
                    documents
                text:
                  type: string
                  description: >-
                    The content of the variable, which can be text, HTML, or a base64 encoded string
                    for images
                mimeType:
                  type: string
                  description: >-
                    The type of content that the variable holds, which can be `text`, `html`, or
                    `image`
                allowRichTextInjection:
                  type: boolean
                  description: >-
                    Used in other parts of the API, this specifies if this variable can be used in
                    Rich Text Injection. For knowledgebase/folders, it is best practice to leave
                    this set to true
                  enum:
                    - true
                    - false
              required:
                - name
                - placeholder
                - text
                - mimeType
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                data:
                  results:
                    variable:
                      id: e4f5a6b7-8c9d-4e0f-a1b2-3c4d5e6f7a8b
                      name: Company Logo
                      placeholder: '{CompanyLogo}'
                      mimeType: image
                      isGlobal: false
                      templateFolderId: 9d2b1c63-0f77-4a9c-b1d0-2c5e6f7a8b90
                      allowRichTextInjection: true
                      orgId: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      createdBy: f5e6d7c8-9a0b-4c1d-2e3f-4a5b6c7d8e9f
                      createdOn: '2026-05-01T14:22:10.000Z'
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          variable:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              placeholder:
                                type: string
                              mimeType:
                                type: string
                              isGlobal:
                                type: boolean
                              templateFolderId:
                                type: string
                              allowRichTextInjection:
                                type: boolean
                              orgId:
                                type: string
                              createdBy:
                                type: string
                              createdOn:
                                type: string
        '400':
          description: >-
            `placeholder` is not wrapped in `{ }`, or already exists in that folder or knowledge
            base. Response body: `{ "message", "type": "TemplateError", "data": [{ "message",
            "type", "data": { "explanation", "context" } }] }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: >-
            `isGlobal: true` and the key's role is `user` (creating a knowledge-base variable
            requires administrator or contributor). The response has no body.
    get:
      tags:
        - Variables
      summary: Read Variables (Folder)
      description: >-
        List the variables in your knowledge base or a template folder, with search, tags, and
        pagination. Includes example request and response.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
          example: '5'
        - name: showTags
          in: query
          schema:
            type: boolean
            enum:
              - true
              - false
          example: 'true'
        - name: templateFolderId
          in: query
          schema:
            type: string
          example: '{{templateFolderId}}'
      responses:
        '200':
          description: An image variable's `text` holds a `data:` URI rather than plain text.
          content:
            application/json:
              example:
                data:
                  results:
                    - id: e4f5a6b7-8c9d-4e0f-a1b2-3c4d5e6f7a8b
                      variableMapId: e4f5a6b7-8c9d-4e0f-a1b2-3c4d5e6f7a8b
                      name: Company Address
                      placeholder: '{CompanyAddress}'
                      description: Standard mailing address block
                      mimeType: text
                      text: 123 Main St, Suite 400, Austin, TX 78701
                      isGlobal: true
                      templateFolderId: null
                      allowRichTextInjection: false
                      createdBy: f5e6d7c8-9a0b-4c1d-2e3f-4a5b6c7d8e9f
                      updatedOn: '2026-05-01T14:22:10.000Z'
                  totalRecords: 1
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            variableMapId:
                              type: string
                            name:
                              type: string
                            placeholder:
                              type: string
                            description:
                              type: string
                            mimeType:
                              type: string
                            text:
                              type: string
                            isGlobal:
                              type: boolean
                            templateFolderId:
                              nullable: true
                            allowRichTextInjection:
                              type: boolean
                            createdBy:
                              type: string
                            updatedOn:
                              type: string
                      totalRecords:
                        type: integer
        '400':
          description: >-
            Both `isGlobal` and `templateFolderId` are set, or a query parameter fails validation.
            Response body: `{ "message", "type": "ValidationError", "data": { "errors": [...] } }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
  /template/file:
    post:
      tags:
        - Templates
      summary: Extract Template Placeholders and Generate Preview
      description: >-
        Upload a DOCX or PPTX file to extract its {placeholder} variables and fonts, and optionally
        render a PDF preview, before creating the template.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: This is an example Template
                  format: binary
      parameters:
        - name: x-filename
          in: header
          schema:
            type: string
          example: SOW Template.docx
      responses:
        '200':
          description: >-
            With `skipFile=true`:


            Without `skipFile`, the response also includes `templatePdf`, the rendered PDF of the
            uploaded file. It is a JSON-serialized Node.js Buffer, not a base64 string: an object of
            the form `{"type": "Buffer", "data": [37, 80, 68, 70, ...]}`, where `data` is an array
            of the PDF's raw bytes. To use it, reconstruct the binary from the byte array, for
            example `Buffer.from(templatePdf.data)` in Node.js or `new Uint8Array(templatePdf.data)`
            in the browser. Pass the `vars` array as the `variables` field (JSON-stringified) when
            you subsequently call [Upload Template with Optional Default
            Values](/docs/API/upload-template-with-optional-default-values).
          content:
            application/json:
              example:
                data:
                  results:
                    filetype: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                    vars:
                      - placeholder: '{CustomerName}'
                        name: CustomerName
                        mimeType: text
                        order: 0
                        count: 1
                        allowRichTextInjection: false
                    fonts:
                      - name: Calibri
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          filetype:
                            type: string
                          vars:
                            type: array
                            items:
                              type: object
                              properties:
                                placeholder:
                                  type: string
                                name:
                                  type: string
                                mimeType:
                                  type: string
                                order:
                                  type: integer
                                count:
                                  type: integer
                                allowRichTextInjection:
                                  type: boolean
                          fonts:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
        '400':
          description: >-
            Your plan's template or storage limit is reached. Response body: `{ "message", "type",
            "data": { "explanation", "context" } }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator, contributor, or user. The response has no body.
        '503':
          description: >-
            The storage service is temporarily unavailable. Response body: `{ "message", "error",
            "data": { "explanation", "context" } }`
  /template:
    post:
      tags:
        - Templates
      summary: Upload Template with Optional Default Values
      description: >-
        Programmatically upload a DOCX or PPTX template to TurboDocx via the API, with named
        variables, placeholders, and default values. Includes a full multipart example request,
        response, and error handling.
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                templateFile:
                  type: string
                  format: binary
                name:
                  type: string
                  example: SOW Template
                description:
                  type: string
                variables:
                  type: string
                  example: >-
                    [{"placeholder":"CustomerName","name":"CustomerName","allowRichTextInjection":false,"order":0,"count":25},{"placeholder":"ProjectName","name":"ProjectName","allowRichTextInjection":false,"order":1,"count":2},{"placeholder":"Date","name":"Date","allowRichTextInjection":false,"order":2,"count":2},{"placeholder":"CustomerLogo","name":"CustomerLogo","allowRichTextInjection":true,"order":3,"count":1},{"placeholder":"VersionNumber","name":"VersionNumber","allowRichTextInjection":false,"order":4,"count":1},{"placeholder":"Scope","name":"Scope","allowRichTextInjection":true,"order":5,"count":1},{"placeholder":"BillRate","name":"BillRate","allowRichTextInjection":false,"order":6,"count":1}]
                tags:
                  type: string
                  example: '[]'
      responses:
        '201':
          description: >-
            Use the returned `id` as the `TemplateId` for generating documents or for [Delete
            Template](/docs/API/delete-template).
          content:
            application/json:
              example:
                data:
                  results:
                    template:
                      id: 2b8f1c9e-4d3a-4a7c-9f21-6b0d5e9a1c34
                      name: SOW Template
                      description: Standard statement of work
                      orgId: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      createdBy: f5e6d7c8-9a0b-4c1d-2e3f-4a5b6c7d8e9f
                      isActive: true
                      templateFolderId: null
                      defaultFont: null
                      fonts: null
                      metadata: null
                      projectspaceId: null
                      createdOn: '2026-05-01T14:22:10.000Z'
                      updatedOn: '2026-05-01T14:22:10.000Z'
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          template:
                            type: object
                            properties:
                              id:
                                type: string
                              name:
                                type: string
                              description:
                                type: string
                              orgId:
                                type: string
                              createdBy:
                                type: string
                              isActive:
                                type: boolean
                              templateFolderId:
                                nullable: true
                              defaultFont:
                                nullable: true
                              fonts:
                                nullable: true
                              metadata:
                                nullable: true
                              projectspaceId:
                                nullable: true
                              createdOn:
                                type: string
                              updatedOn:
                                type: string
        '400':
          description: >-
            Your plan's template or storage limit is reached. Response body: `{ "message", "type",
            "data": { "explanation", "context" } }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator, contributor, or user. The response has no body.
        '503':
          description: >-
            The storage service is temporarily unavailable. Response body: `{ "message", "error",
            "data": { "explanation", "context" } }`
  /template/{TemplateID}:
    get:
      tags:
        - Templates
      summary: Get Template by ID
      description: >-
        Fetch a single template by ID: its metadata, tags, and merged variables (template, folder,
        and global). Includes example request, response, and error handling.
      parameters:
        - name: showTags
          in: query
          schema:
            type: boolean
            enum:
              - true
              - false
          example: 'true'
        - name: TemplateID
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: >-
            `isTurboDocxProvided` is `true` for templates from the built-in TurboDocx library; those
            cannot be edited in place and must be downloaded and re-uploaded to customize. Each
            entry in `variables` mirrors the variable fields returned by generation, with
            `isTemplateFolder` set on variables inherited from the template's folder.
          content:
            application/json:
              example:
                data:
                  results:
                    id: 2b8f1c9e-4d3a-4a7c-9f21-6b0d5e9a1c34
                    name: SOW Template
                    description: Standard statement of work
                    isActive: true
                    createdOn: '2026-05-01T14:22:10.000Z'
                    updatedOn: '2026-05-01T14:22:10.000Z'
                    createdBy: f5e6d7c8-9a0b-4c1d-2e3f-4a5b6c7d8e9f
                    firstName: Jane
                    lastName: Doe
                    email: jane@example.com
                    orgId: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    templateFolderId: null
                    defaultFont: Calibri
                    fonts:
                      - name: Calibri
                    metadata: {}
                    templateFileType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
                    isTurboDocxProvided: false
                    deliverableCount: 12
                    variables:
                      - placeholder: '{CustomerName}'
                        name: CustomerName
                        mimeType: text
                        order: 0
                        count: 1
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          description:
                            type: string
                          isActive:
                            type: boolean
                          createdOn:
                            type: string
                          updatedOn:
                            type: string
                          createdBy:
                            type: string
                          firstName:
                            type: string
                          lastName:
                            type: string
                          email:
                            type: string
                          orgId:
                            type: string
                          templateFolderId:
                            nullable: true
                          defaultFont:
                            type: string
                          fonts:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                          metadata:
                            type: object
                            properties: {}
                          templateFileType:
                            type: string
                          isTurboDocxProvided:
                            type: boolean
                          deliverableCount:
                            type: integer
                          variables:
                            type: array
                            items:
                              type: object
                              properties:
                                placeholder:
                                  type: string
                                name:
                                  type: string
                                mimeType:
                                  type: string
                                order:
                                  type: integer
                                count:
                                  type: integer
        '400':
          description: >-
            The `TemplateID` path parameter is not a valid UUID. Response body: `{ "message",
            "type": "ValidationError", "data": { "errors": [...] } }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '404':
          description: No active template with that ID exists in your organization. The response has no body.
  /Variable/{VariableId}:
    put:
      tags:
        - Variables
      summary: Update Variable (by ID)
      description: >-
        Update a knowledge-base or folder variable's name, content, or tags by ID. Includes example
        request, response, and error handling.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the variable
                description:
                  type: string
                  description: The description of the variable
                tags:
                  type: array
                items:
                  type: string
                  description: List of tags associated with the variable
                placeholder:
                  type: string
                  description: >-
                    A unique placeholder text that is used to insert the variable content into
                    documents
                text:
                  type: string
                  description: >-
                    The content of the variable, which can be text, HTML, or a base64 encoded string
                    for images
                mimeType:
                  type: string
                  description: >-
                    The type of content that the variable holds, which can be `text`, `html`, or
                    `image`
                allowRichTextInjection:
                  type: boolean
                  description: >-
                    Used in other parts of the API, this specifies if this variable can be used in
                    Rich Text Injection. For knowledgebase/folders, it is best practice to leave
                    this set to true
                  enum:
                    - true
                    - false
                isGlobal:
                  type: boolean
                  description: >-
                    A flag indicating whether the variable is global (i.e., part of the
                    Knowledgebase). If true, the variable is available across all templates and
                    templateFolderId should not be provided. This field is required if
                    templateFolderId is not provided
                  enum:
                    - true
                    - false
        parameters:
          - name: authorization
            in: header
            schema:
              type: string
            example: Bearer {{TurboDocx Access Token}}
          - name: x-rapiddocx-org-id
            in: header
            schema:
              type: string
            example: '{{TurboDocx Organization ID}}'
          - name: accept
            in: header
            schema:
              type: string
            example: application/json, text/plain, */*
          - name: accept-language
            in: header
            schema:
              type: string
            example: en-US,en;q=0.9
          - name: content-type
            in: header
            schema:
              type: string
            example: application/json
          - name: dnt
            in: header
            schema:
              type: integer
            example: '1'
          - name: origin
            in: header
            schema:
              type: string
            example: https://app.turbodocx.com
          - name: referer
            in: header
            schema:
              type: string
            example: https://app.turbodocx.com/
          - name: sec-ch-ua
            in: header
            schema:
              type: string
            example: '"Google Chrome";v="123", "Not:A-Brand";v="8", "Chromium";v="123"'
          - name: sec-ch-ua-mobile
            in: header
            schema:
              type: string
            example: '?0'
          - name: sec-ch-ua-platform
            in: header
            schema:
              type: string
            example: '"Windows"'
          - name: sec-fetch-dest
            in: header
            schema:
              type: string
            example: empty
          - name: sec-fetch-mode
            in: header
            schema:
              type: string
            example: cors
          - name: sec-fetch-site
            in: header
            schema:
              type: string
            example: same-site
          - name: VariableId
            in: path
            schema:
              type: string
            required: true
        responses:
          '200':
            description: Successful response
            content:
              application/json: {}
      parameters:
        - name: VariableId
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                variable:
                  id: e4f5a6b7-8c9d-4e0f-a1b2-3c4d5e6f7a8b
                  name: Company Address
                  placeholder: '{CompanyAddress}'
                  mimeType: text
                  text: 123 Main St, Suite 400, Austin, TX 78701
                  isGlobal: true
                  templateFolderId: null
                  updatedOn: '2026-05-02T09:00:00.000Z'
              schema:
                type: object
                properties:
                  variable:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      placeholder:
                        type: string
                      mimeType:
                        type: string
                      text:
                        type: string
                      isGlobal:
                        type: boolean
                      templateFolderId:
                        nullable: true
                      updatedOn:
                        type: string
        '400':
          description: >-
            `mimeType` or `text` is missing, or both `isGlobal` and `templateFolderId` are set.
            Response body: `{ "message", "type": "ValidationError", "data": { "errors": [...] } }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: >-
            The key's role is not administrator, contributor, or user. For `isGlobal: true` updates
            (as in the example above), only administrator and contributor are allowed; the `user`
            role is also rejected with `403`.. The response has no body.
        '409':
          description: >-
            The variable was deleted or modified by someone else before this update landed. Response
            body: `{ "error", "data": { "explanation" } }`
  /Variable/bulk/action:
    delete:
      tags:
        - Variables
      summary: Delete Variables (by IDs)
      description: >-
        Delete one or more knowledge-base or folder variables in a single call, by variableMapId.
        Includes example request, response, and errors.
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                data: {}
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties: {}
        '400':
          description: >-
            `ids` is missing or not an array. Response body: `{ "message", "type":
            "ValidationError", "data": { "errors": [...] } }`
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator, contributor, or user. The response has no body.
  /Tag:
    post:
      tags:
        - Tags
      summary: Create Tag
      description: >-
        Create a reusable tag in your organization to attach to templates and variables. Includes
        example request, response, and error handling.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  description: The updated label of the tag
              required:
                - label
      responses:
        '200':
          description: Success
          content:
            application/json:
              example:
                data:
                  results:
                    id: 7c1a0b52-9e88-4f0d-b3a2-1d4c6f8e2a90
                    label: legal
                    isActive: true
                    orgId: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                    createdBy: f5e6d7c8-9a0b-4c1d-2e3f-4a5b6c7d8e9f
