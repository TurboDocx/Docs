            example:
              deliverableId: 39697685-ca00-43b8-92b8-7722544c574f
              documentName: Service Agreement
              senderEmail: sender@example.com
              recipients: '[{"name":"John Smith","email":"john.smith@example.com","signingOrder":1}]'
              fields: >-
                [{"recipientEmail":"john.smith@example.com","type":"signature","template":{"anchor":"{Signature1}","placement":"replace","size":{"width":200,"height":80}}}]
      responses:
        '200':
          description: The document was sent for signature.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  documentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: '`under_review`: out for signature.'
                    example: under_review
                  recipients:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
