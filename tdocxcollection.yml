  /v1/deliverable/file/{deliverableId}:
    get:
      tags:
        - Deliverables
      summary: Download Deliverable Source File
      description: >-
        Downloads the generated document in its source format, a Word (.docx) or PowerPoint (.pptx)
        file, as an attachment. Your plan must include file downloads.
      parameters:
        - name: deliverableId
          in: path
          required: true
          description: The deliverable ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: >-
            The file. `Content-Type` is the Word or PowerPoint MIME type and `Content-Disposition`
            names the file after the deliverable.
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
        '400':
          description: Your organization's plan does not include file downloads.
          content:
            application/json:
              example:
                message: Please contact support, it appears you are missing a feature entitlement.
                type: MissingEntitlement
                data:
                  explanation: Missing Entitlement for this feature.
                  context: ''
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      explanation:
                        type: string
                      context:
                        type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: The key's role cannot download files (viewers cannot). The response has no body.
        '404':
          description: >-
            No deliverable with this ID exists in your organization (no JSON body), or its file
            could not be loaded (JSON body below).
          content:
            application/json:
              example:
                message: There was an issue loading your file
                error: ServerError
                data:
                  explanation: There was an issue loading your file. Please contact support.
                  context: ''
              schema:
                type: object
                properties:
                  message:
                    type: string
                  error:
                    type: string
                  data:
                    type: object
                    properties:
                      explanation:
                        type: string
                      context:
                        type: string
      x-codeSamples:
        - lang: NodeJs
          label: SDK
          source: |
            import { writeFile } from 'node:fs/promises';
            import { Deliverable } from '@turbodocx/sdk';

            Deliverable.configure({
              apiKey: process.env.TURBODOCX_API_KEY,
              orgId: process.env.TURBODOCX_ORG_ID,
            });

            const file = await Deliverable.downloadSourceFile('YOUR_DELIVERABLE_ID');
            await writeFile('deliverable.docx', Buffer.from(file));
            console.log(`Saved deliverable.docx (${file.byteLength} bytes)`);
        - lang: Python
          label: SDK
          source: |
            import asyncio
            import os

            from turbodocx_sdk import Deliverable

            Deliverable.configure(
                api_key=os.environ["TURBODOCX_API_KEY"],
                org_id=os.environ["TURBODOCX_ORG_ID"],
            )


            async def main():
                content = await Deliverable.download_source_file("YOUR_DELIVERABLE_ID")
                with open("deliverable.docx", "wb") as f:
                    f.write(content)
                print(f"Saved deliverable.docx ({len(content)} bytes)")


            asyncio.run(main())
        - lang: PHP
          label: SDK
          source: |
            <?php
            require __DIR__ . '/vendor/autoload.php';

            use TurboDocx\Deliverable;
            use TurboDocx\Config\DeliverableConfig;

            Deliverable::configure(new DeliverableConfig(
                apiKey: getenv('TURBODOCX_API_KEY') ?: null,
                orgId: getenv('TURBODOCX_ORG_ID') ?: null,
