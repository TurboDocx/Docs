                  example: >-
                    [{"recipientEmail":"john.smith@example.com","type":"signature","template":{"anchor":"{Signature1}","placement":"replace","size":{"width":200,"height":80}}}]
                ccEmails:
                  type: string
                  description: >-
                    CC addresses as a JSON-encoded string array, for example
                    `["legal@example.com"]`.
                senderName:
                  type: string
                  maxLength: 255
                  description: Sender name shown to recipients. Defaults to the name of your API key.
                senderEmail:
                  type: string
                  format: email
                  maxLength: 255
                  description: >-
                    Reply-to address on the signature email and the sender recorded in the audit
