  /api/webhooks/signature/replay:
    post:
      tags:
        - Webhooks
      summary: Replay Webhook Delivery
      description: >-
        Manually retry one past delivery by its ID. Creates a new delivery row and immediately
        re-sends the event to the URL the original delivery targeted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                deliveryId:
                  type: string
                  description: The ID of the delivery to replay.
                  example: dlv_abc123
              required:
                - deliveryId
      responses:
        '200':
          description: >-
            Check the new delivery's status afterward with [List Webhook
            Deliveries](/docs/API/list-webhook-deliveries).
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      webhookId:
                        type: string
                      eventType:
                        type: string
                      payload:
                        type: object
                      httpStatus:
                        type: integer
                        nullable: true
                      isDelivered:
                        type: boolean
                      attemptCount:
                        type: integer
                      deliveredAt:
                        type: string
                        format: date-time
                        nullable: true
                      createdOn:
                        type: string
                        format: date-time
                  message:
                    type: string
              example:
                data:
                  id: f2e1d0c9-8b7a-4695-a3b2-1c0d9e8f7a6b
                  eventType: signature.document.completed
                  url: https://example.com/webhooks/turbodocx
                  attemptCount: 0
                  maxAttempts: 3
                  isDelivered: false
                  status: pending
                  createdOn: '2026-05-02T09:30:00.000Z'
                  updatedOn: '2026-05-02T09:30:00.000Z'
                message: Webhook delivery replayed successfully - new delivery attempt created
        '400':
          description: >-
            `deliveryId` is missing or not a valid UUID. Response body: Validation error from the
            body schema
          content:
            application/json: {}
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator. The response has no body.
        '404':
          description: >-
