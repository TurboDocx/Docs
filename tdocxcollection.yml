  /turbosign/documents/{documentId}/audit-trail:
    get:
      tags:
        - TurboSign
      summary: Get Audit Trail
      description: >-
        Returns every recorded event on a document in time order, such as sent, viewed, signed and
        voided, with the person who acted. Entries form a hash chain, so each `currentHash` builds
        on the previous entry's hash and tampering would break the chain.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The document and its audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      document:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                      auditTrail:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            documentId:
                              type: string
                              format: uuid
                            actionType:
                              type: string
                              description: >-
                                The event, for example `prepared_for_review`, `document_sent`,
                                `document_viewed`, `document_signed`, `document_voided` or
                                `reminder_sent`.
                            timestamp:
                              type: string
                              format: date-time
                            previousHash:
                              type: string
                              nullable: true
                            currentHash:
                              type: string
                            createdOn:
                              type: string
                              format: date-time
                            details:
                              type: object
                              description: Event details, such as IP address and user agent.
                            user:
                              type: object
                              description: Present when a sender acted.
                              properties:
                                name:
                                  type: string
                                email:
                                  type: string
                            userId:
                              type: string
                              format: uuid
                            recipient:
                              type: object
                              description: Present when a recipient acted.
                              properties:
                                name:
                                  type: string
                                email:
                                  type: string
                            recipientId:
                              type: string
                              format: uuid
              example:
                data:
                  document:
                    id: 4a20eca5-7944-430c-97d5-fcce4be24296
                    name: Service Agreement
                  auditTrail:
                    - id: b1c2d3e4-f5a6-4b7c-8d9e-0f1a2b3c4d5e
                      documentId: 4a20eca5-7944-430c-97d5-fcce4be24296
                      actionType: document_sent
                      timestamp: '2026-01-15T10:35:00.000Z'
                      previousHash: null
                      currentHash: a1b2c3d4e5f6...
                      createdOn: '2026-01-15T10:35:00.000Z'
                      details:
                        ipAddress: 203.0.113.10
                      user:
                        name: Jane Sender
                        email: sender@example.com
                      userId: f5e6d7c8-9a0b-4c1d-8e3f-4a5b6c7d8e9f
                    - id: c2d3e4f5-a6b7-4c8d-9e0f-1a2b3c4d5e6f
                      documentId: 4a20eca5-7944-430c-97d5-fcce4be24296
                      actionType: document_signed
                      timestamp: '2026-01-16T14:02:00.000Z'
                      previousHash: a1b2c3d4e5f6...
                      currentHash: b2c3d4e5f6a7...
                      createdOn: '2026-01-16T14:02:00.000Z'
                      details:
                        ipAddress: 198.51.100.7
                      recipient:
                        name: John Smith
                        email: john.smith@example.com
                      recipientId: 5f673f37-9912-4e72-85aa-8f3649760f6b
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '404':
          description: The document does not exist, was deleted, or belongs to another organization.
          content:
            application/json:
              example:
                error: Document not found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to get audit trail
              schema:
                type: object
                properties:
                  error:
                    type: string
