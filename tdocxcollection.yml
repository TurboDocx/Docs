          source: |
            import asyncio
            import os

            from turbodocx_sdk import TurboSign

            TurboSign.configure(
                api_key=os.environ["TURBODOCX_API_KEY"],
                org_id=os.environ["TURBODOCX_ORG_ID"],
                sender_email="sender@example.com",
                sender_name="Your Company",
            )


            async def main():
                result = await TurboSign.create_signature_review_link(
                    file_link="https://example.com/contracts/service-agreement.pdf",
                    document_name="Service Agreement",
                    recipients=[
                        {"name": "Jane Smith", "email": "jane.smith@example.com", "signingOrder": 1},
                    ],
                    fields=[
                        {
                            "type": "signature",
                            "recipientEmail": "jane.smith@example.com",
                            "page": 1,
                            "x": 100,
                            "y": 500,
                            "width": 200,
                            "height": 50,
                        },
                    ],
                )
                print(result)


            asyncio.run(main())
        - lang: PHP
          label: SDK
          source: |
            <?php
            require __DIR__ . '/vendor/autoload.php';

            use TurboDocx\TurboSign;
            use TurboDocx\Config\HttpClientConfig;
            use TurboDocx\Types\Recipient;
            use TurboDocx\Types\Field;
            use TurboDocx\Types\SignatureFieldType;
            use TurboDocx\Types\Requests\CreateSignatureReviewLinkRequest;

            TurboSign::configure(new HttpClientConfig(
                apiKey: getenv('TURBODOCX_API_KEY') ?: null,
                orgId: getenv('TURBODOCX_ORG_ID') ?: null,
                senderEmail: 'sender@example.com',
                senderName: 'Your Company',
            ));

            $result = TurboSign::createSignatureReviewLink(new CreateSignatureReviewLinkRequest(
                recipients: [
                    new Recipient('Jane Smith', 'jane.smith@example.com', 1),
                ],
                fields: [
                    new Field(
                        type: SignatureFieldType::SIGNATURE,
                        recipientEmail: 'jane.smith@example.com',
                        page: 1,
                        x: 100,
                        y: 500,
                        width: 200,
                        height: 50,
                    ),
                ],
                fileLink: 'https://example.com/contracts/service-agreement.pdf',
                documentName: 'Service Agreement',
            ));
            print_r($result);
        - lang: Ruby
          label: SDK
          source: |
            require "turbodocx_sdk"

            TurboDocxSdk::TurboSign.configure(
              api_key: ENV["TURBODOCX_API_KEY"],
              org_id: ENV["TURBODOCX_ORG_ID"],
              sender_email: "sender@example.com",
              sender_name: "Your Company"
            )

            # Request keys are sent as-is, so use the API's camelCase names
            result = TurboDocxSdk::TurboSign.create_signature_review_link(
              fileLink: "https://example.com/contracts/service-agreement.pdf",
              documentName: "Service Agreement",
              recipients: [
                { name: "Jane Smith", email: "jane.smith@example.com", signingOrder: 1 }
              ],
              fields: [
                {
                  type: "signature",
                  recipientEmail: "jane.smith@example.com",
                  page: 1,
                  x: 100,
                  y: 500,
                  width: 200,
                  height: 50
                }
              ]
            )
            p result
        - lang: Go
          label: SDK
          source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n\n\tturbodocx \"github.com/TurboDocx/SDK/packages/go-sdk\"\n)\n\nfunc main() {\n\tctx := context.Background()\n\n\tclient, err := turbodocx.NewClientWithConfig(turbodocx.ClientConfig{\n\t\tAPIKey:      os.Getenv(\"TURBODOCX_API_KEY\"),\n\t\tOrgID:       os.Getenv(\"TURBODOCX_ORG_ID\"),\n\t\tSenderEmail: \"sender@example.com\",\n\t\tSenderName:  \"Your Company\",\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tresult, err := client.TurboSign.CreateSignatureReviewLink(ctx, &turbodocx.CreateSignatureReviewLinkRequest{\n\t\tFileLink:     \"https://example.com/contracts/service-agreement.pdf\",\n\t\tDocumentName: \"Service Agreement\",\n\t\tRecipients: []turbodocx.Recipient{\n\t\t\t{Name: \"Jane Smith\", Email: \"jane.smith@example.com\", SigningOrder: 1},\n\t\t},\n\t\tFields: []turbodocx.Field{\n\t\t\t{\n\t\t\t\tType:           \"signature\",\n\t\t\t\tRecipientEmail: \"jane.smith@example.com\",\n\t\t\t\tPage:           1,\n\t\t\t\tX:              100,\n\t\t\t\tY:              500,\n\t\t\t\tWidth:          200,\n\t\t\t\tHeight:         50,\n\t\t\t},\n\t\t},\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Printf(\"%+v\\n\", result)\n}\n"
  /turbosign/single/prepare-for-signing:
    post:
      tags:
        - TurboSign
      summary: Send Document for Signature
      description: >-
        Creates a signature document from a file, deliverable, template or URL and sends it for
        signature in one call. Signing emails go out in the background right after the response; set
        `sendEmail` to `false` when signers sign inside your app instead.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - recipients
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    PDF, DOCX or PPTX to send, up to 25 MB. Repeat the `file` part (up to 5 files,
                    25 MB in total) to merge them into one PDF. One file source is required.
                deliverableId:
                  type: string
                  format: uuid
                  description: Send an existing deliverable. One file source is required.
                templateId:
                  type: string
                  format: uuid
                  description: >-
                    Send a template (Word, PowerPoint, or a PDF signature template). Required when
                    any recipient has a `role`. One file source is required.
                fileLink:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: >-
                    Public URL of a PDF, DOCX or PPTX to download and send. One file source is
                    required.
                fileName:
                  type: string
                  maxLength: 255
                  description: File name to use for the uploaded or downloaded file.
                documentName:
                  type: string
                  maxLength: 255
                  description: Document name shown to signers and in TurboDocx.
                documentDescription:
                  type: string
                  maxLength: 1000
                  description: Message included in the signature email.
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 15
                  description: Signers, sent as one JSON-encoded string part.
                  items:
                    type: object
                    required:
                      - name
                      - email
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Signer's full name.
                        example: John Smith
                      email:
                        type: string
                        format: email
                        description: Signer's email address. Must be unique within the document.
                        example: john.smith@example.com
                      signingOrder:
                        type: integer
                        minimum: 1
                        description: >-
                          Position in the signing sequence, starting at 1 with no gaps. Required
                          unless the recipient has a `role`.
                        example: 1
                      role:
                        type: string
                        description: >-
                          Key of a signer role saved on the template (for example `client`), matched
                          ignoring case. Requires `templateId`; the role's saved fields are placed
                          for this signer.
                      metadata:
                        type: object
                        description: Optional display colors for this signer in the TurboDocx app.
                        properties:
                          color:
                            type: string
                            description: HSL color, for example `hsl(200, 75%, 50%)`.
                          lightColor:
                            type: string
                            description: Light HSL color, for example `hsl(200, 75%, 93%)`.
                      phone:
                        type: string
                        description: >-
                          Signer's mobile number in E.164 format (for example `+15551234567`).
                          Required when the passcode is sent by SMS.
                      externalId:
                        type: string
                        maxLength: 256
                        description: >-
                          Your own identifier for the signer, unique within the document. Lets you
                          request a signing URL by this value.
                      otpChannel:
                        type: string
                        enum:
                          - none
                          - email
                          - sms
                        description: >-
                          How the signer receives a one-time passcode. Omitted means your
                          organization's default. Equivalent to an `identityVerification` block with
                          `mode: otp`.
                      identityVerification:
                        type: object
                        description: >-
                          How the signer proves their identity. Omit it to use your organization's
                          default.
                        required:
                          - mode
                        properties:
                          mode:
                            type: string
                            enum:
                              - otp
                              - external_idv
                              - override
                          channel:
                            type: string
                            enum:
                              - email
                              - sms
                            description: >-
                              For `otp`: how the passcode is delivered. Omitted means your
                              organization's default.
                          provider:
                            type: string
                            description: 'For `external_idv`: the name of your identity verification provider.'
                          maxAgeMinutes:
                            type: integer
                            description: >-
                              For `external_idv`: how old a verification may be when you request the
                              signing URL.
                          overrideIdentityVerification:
                            type: boolean
                            description: >-
                              For `override`: must be `true` to acknowledge that verification is
                              skipped.
                            enum:
                              - true
                              - false
                          reason:
                            type: string
                            description: 'For `override`: why verification is skipped.'
                fields:
                  type: array
                  maxItems: 150
                  description: >-
                    Fields to place, sent as one JSON-encoded string part. Required and non-empty
                    unless a recipient names a template `role`.
                  items:
                    type: object
                    required:
                      - recipientEmail
                      - type
                    description: >-
                      A field placed either by text anchor (`template`) or by coordinates (`page`,
                      `x`, `y`, `width`, `height`).
                    properties:
                      recipientEmail:
                        type: string
                        format: email
                        description: >-
                          Email of the recipient who fills this field. Must match a recipient's
                          `email`.
                        example: john.smith@example.com
                      type:
                        type: string
                        enum:
                          - signature
                          - initial
                          - date
                          - full_name
                          - first_name
                          - last_name
                          - title
                          - company
                          - email
                          - text
                          - checkbox
                        example: signature
                      required:
                        type: boolean
                        nullable: true
                        description: >-
                          Whether the signer must fill the field. Defaults to `true`; `null` counts
                          as `true`. Cannot be `false` on `signature` or `initial` fields, and must
                          be a JSON boolean.
                        enum:
                          - true
                          - false
                      defaultValue:
                        type: string
                        maxLength: 600
                        description: >-
                          Pre-filled value submitted with the signature. Not allowed on `signature`
                          or `initial`. A `checkbox` takes `"true"` or `"false"`; a `date` takes
                          `MM/DD/YYYY`.
                      isReadonly:
                        type: boolean
                        description: Make the field read-only for the signer. Use with `defaultValue`.
                        enum:
                          - true
                          - false
                      isMultiline:
                        type: boolean
                        description: Allow multiple lines in a text field.
                        enum:
                          - true
                          - false
                      backgroundColor:
                        type: string
                        description: >-
                          Background color: hex (`#FFFFFF`), `rgb(255,255,255)`, or a named color
                          such as `white`.
                      metadata:
                        type: object
                        description: Conditional (IF/THEN) field settings. Other keys are kept with the field.
                        properties:
                          fieldKey:
                            type: string
                            maxLength: 100
                            description: >-
                              Stable identifier on a controlling checkbox, referenced by dependent
                              fields.
                          conditional:
                            type: object
                            description: Rule on a dependent field that ties it to a controlling checkbox.
                            required:
                              - controllingFieldKey
                              - operator
                              - action
                            properties:
                              controllingFieldKey:
                                type: string
                                maxLength: 100
                              operator:
                                type: string
                                enum:
                                  - is_checked
                                  - is_not_checked
                              action:
                                type: string
                                enum:
                                  - show
                                  - unlock
                      template:
                        type: object
                        description: Anchor-based placement. Give at least `anchor` or `searchText`.
                        properties:
                          anchor:
                            type: string
                            description: >-
                              Text in the document to place the field on, in single braces, for
                              example `{Signature1}`.
                            example: '{Signature1}'
                          searchText:
                            type: string
                            description: Plain text to search for instead of a braced anchor.
                          placement:
                            type: string
                            enum:
                              - replace
                              - after
                              - before
                              - above
                              - below
                            default: replace
                          size:
                            type: object
                            required:
                              - width
                              - height
                            properties:
                              width:
                                type: number
                                exclusiveMinimum: true
                                minimum: 0
                                example: 200
                              height:
                                type: number
                                exclusiveMinimum: true
                                minimum: 0
                                example: 80
                          offset:
                            type: object
                            required:
                              - x
                              - 'y'
                            properties:
                              x:
                                type: number
                                example: 0
                              'y':
                                type: number
                                example: 0
                          caseSensitive:
                            type: boolean
                            default: false
                            description: Match the anchor case-sensitively.
                            enum:
                              - true
                              - false
                          useRegex:
                            type: boolean
                            default: false
                            description: Treat the anchor as a regular expression.
                            enum:
                              - true
                              - false
                          alignment:
                            type: string
                            enum:
                              - left
                              - center
                              - right
                            nullable: true
                            description: Where the signer's entry sits inside the field.
                      page:
                        type: integer
                        minimum: 1
                        description: 'Coordinate placement: page number, starting at 1.'
                      x:
                        type: number
                        minimum: 0
                        description: 'Coordinate placement: distance from the left edge.'
                      'y':
                        type: number
                        minimum: 0
                        description: 'Coordinate placement: distance from the top edge.'
                      width:
                        type: number
                        exclusiveMinimum: true
                        minimum: 0
                        description: 'Coordinate placement: field width.'
                      height:
                        type: number
                        exclusiveMinimum: true
                        minimum: 0
                        description: 'Coordinate placement: field height.'
                      pageWidth:
                        type: number
                        description: 'Coordinate placement: page width the coordinates were measured on.'
                      pageHeight:
                        type: number
                        description: 'Coordinate placement: page height the coordinates were measured on.'
                      alignment:
                        type: string
                        enum:
                          - left
                          - center
                          - right
                        nullable: true
                        description: Where the signer's entry sits inside the field.
                ccEmails:
                  type: array
                  maxItems: 15
                  uniqueItems: true
                  description: >-
                    Addresses copied on the completed document, sent as one JSON-encoded string
                    part.
                  items:
                    type: string
                    format: email
                senderName:
                  type: string
                  maxLength: 255
                  description: Sender name shown to recipients. Defaults to the name of your API key.
                senderEmail:
                  type: string
                  format: email
                  maxLength: 255
                  description: >-
                    Reply-to address on the signature email and the sender recorded in the audit
                    trail. Strongly recommended; when omitted a generic TurboDocx address is used.
                language:
                  type: string
                  enum:
                    - en
                    - fr
                    - es
                    - pt
                  description: Language of the emails. Defaults to your organization's preference, then `en`.
                remindersEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Send reminder emails to signers who have not signed. Omitted means your
                    organization's default.
                reminderDelay:
                  type: object
                  description: >-
                    Time from a signer's invitation to their first reminder. `unit` is `hours` or
                    `days`; `value` is a whole number from 1 up to 999 days (23976 hours). In
                    multipart, send it as a JSON string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                reminderInterval:
                  type: object
                  description: >-
                    Gap between later reminders. `unit` is `hours` or `days`; `value` is a whole
                    number from 1 up to 999 days (23976 hours). In multipart, send it as a JSON
                    string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                maxReminders:
                  type: integer
                  minimum: -1
                  maximum: 50
                  description: Most reminders per signer. `-1` means unlimited and `0` means none.
                expirationEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Close the signing window after `expireAfter`. Omitted means your organization's
                    default.
                expireAfter:
                  type: object
                  description: >-
                    How long the document stays signable, counted from sending. `unit` is `hours` or
                    `days`; `value` is a whole number from 1 up to 999 days (23976 hours). In
                    multipart, send it as a JSON string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                expirationWarning:
                  type: object
                  description: >-
                    How long before expiry the warning emails start. `0` means never warn. `unit` is
                    `hours` or `days`; `value` is a whole number from 0 up to 999 days (23976
                    hours). In multipart, send it as a JSON string such as
                    `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 0
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                expirationWarningInterval:
                  type: object
                  description: >-
                    Gap between warning emails once they start. `unit` is `hours` or `days`; `value`
                    is a whole number from 1 up to 999 days (23976 hours). In multipart, send it as
                    a JSON string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                sendEmail:
                  type: boolean
                  enum:
                    - true
                    - false
                  default: true
                  description: >-
                    Set to `false` when every signer signs inside your app through a signing URL: no
                    signing-link emails are sent for this document. Passcode and completed-copy
                    emails still go out.
            encoding:
              recipients:
                contentType: application/json
              fields:
                contentType: application/json
              ccEmails:
                contentType: application/json
              reminderDelay:
                contentType: application/json
              reminderInterval:
                contentType: application/json
              expireAfter:
                contentType: application/json
              expirationWarning:
                contentType: application/json
              expirationWarningInterval:
                contentType: application/json
          application/json:
            schema:
              type: object
              required:
                - recipients
              properties:
                deliverableId:
                  type: string
                  format: uuid
                  description: Send an existing deliverable. One file source is required.
                templateId:
                  type: string
                  format: uuid
                  description: >-
                    Send a template (Word, PowerPoint, or a PDF signature template). Required when
                    any recipient has a `role`. One file source is required.
                fileLink:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: >-
                    Public URL of a PDF, DOCX or PPTX to download and send. One file source is
                    required.
                fileName:
                  type: string
                  maxLength: 255
                  description: File name to use for the uploaded or downloaded file.
                documentName:
                  type: string
                  maxLength: 255
                  description: Document name shown to signers and in TurboDocx.
                documentDescription:
                  type: string
                  maxLength: 1000
                  description: Message included in the signature email.
                recipients:
                  type: string
                  description: >-
                    Signers as a JSON-encoded string (not a raw array): the same recipient objects
                    described in the multipart/form-data body.
                  example: '[{"name":"John Smith","email":"john.smith@example.com","signingOrder":1}]'
                fields:
                  type: string
                  description: >-
                    Fields as a JSON-encoded string (not a raw array): the same field objects
                    described in the multipart/form-data body. Required unless a recipient names a
                    template `role`.
                  example: >-
                    [{"recipientEmail":"john.smith@example.com","type":"signature","template":{"anchor":"{Signature1}","placement":"replace","size":{"width":200,"height":80}}}]
                ccEmails:
                  type: string
                  description: >-
                    CC addresses as a JSON-encoded string array, for example
                    `["legal@example.com"]`.
                senderName:
                  type: string
                  maxLength: 255
                  description: Sender name shown to recipients. Defaults to the name of your API key.
                senderEmail:
                  type: string
                  format: email
                  maxLength: 255
                  description: >-
                    Reply-to address on the signature email and the sender recorded in the audit
                    trail. Strongly recommended; when omitted a generic TurboDocx address is used.
                language:
                  type: string
                  enum:
                    - en
                    - fr
                    - es
                    - pt
                  description: Language of the emails. Defaults to your organization's preference, then `en`.
                remindersEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Send reminder emails to signers who have not signed. Omitted means your
                    organization's default.
                reminderDelay:
                  type: object
                  description: >-
                    Time from a signer's invitation to their first reminder. `unit` is `hours` or
                    `days`; `value` is a whole number from 1 up to 999 days (23976 hours).
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                reminderInterval:
                  type: object
                  description: >-
                    Gap between later reminders. `unit` is `hours` or `days`; `value` is a whole
                    number from 1 up to 999 days (23976 hours).
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                maxReminders:
                  type: integer
                  minimum: -1
                  maximum: 50
                  description: Most reminders per signer. `-1` means unlimited and `0` means none.
                expirationEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Close the signing window after `expireAfter`. Omitted means your organization's
                    default.
                expireAfter:
                  type: object
                  description: >-
                    How long the document stays signable, counted from sending. `unit` is `hours` or
                    `days`; `value` is a whole number from 1 up to 999 days (23976 hours).
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                expirationWarning:
                  type: object
                  description: >-
                    How long before expiry the warning emails start. `0` means never warn. `unit` is
                    `hours` or `days`; `value` is a whole number from 0 up to 999 days (23976
                    hours).
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 0
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                expirationWarningInterval:
                  type: object
                  description: >-
                    Gap between warning emails once they start. `unit` is `hours` or `days`; `value`
                    is a whole number from 1 up to 999 days (23976 hours).
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
