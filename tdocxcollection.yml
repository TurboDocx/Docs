  /turbosign/documents/{documentId}/resend-email:
    post:
      tags:
        - TurboSign
      summary: Resend Signing Email
      description: >-
        Sends the original signing invitation again to recipients whose turn it is and who have not
        signed. The request is all or nothing: if any ID is not eligible, no email is sent.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - recipientIds
              properties:
                recipientIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: Recipients to email. At least one, all unique.
                  items:
                    type: string
                    format: uuid
                  example:
                    - 5f673f37-9912-4e72-85aa-8f3649760f6b
      responses:
        '200':
          description: The emails were sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                      recipientCount:
                        type: integer
                        description: How many recipients were emailed.
              example:
                data:
                  success: true
                  recipientCount: 1
        '400':
          description: >-
            `recipientIds` is missing or invalid, every recipient has already signed, or some IDs
            are not eligible (not their turn or already signed).
          content:
            application/json:
              examples:
                validation:
                  summary: Missing recipientIds
                  value:
                    message: There was an issue validating the body
                    type: ValidationError
                    data:
                      errors:
                        - message: recipientIds array is required
                          path:
                            - recipientIds
                          type: any.required
                          context:
                            label: recipientIds
                            key: recipientIds
                allSigned:
                  summary: Everyone has signed
                  value:
                    error: All recipients have already completed signing
                notEligible:
                  summary: Some IDs not eligible
                  value:
                    error: Some recipients are not eligible for email resend at this time
                    invalidRecipientIds:
                      - 7a891c23-4d56-4e78-9abc-def012345678
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                label:
                                  type: string
                                key:
                                  type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: The key's role cannot resend emails (viewers cannot). The response has no body.
        '404':
          description: The document does not exist, was deleted, or belongs to another organization.
          content:
            application/json:
              example:
                error: Document not found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: >-
            The document is not out for signature (for example it is still in review, voided, or
            expired), or the recipients sign only through single-use signing URLs.
          content:
            application/json:
              examples:
                notActionable:
                  summary: Document not out for signature
                  value:
                    error: This document has been voided and can no longer be sent.
                    code: DocumentNotActionable
                    status: voided
                singleUse:
                  summary: Recipients sign through single-use URLs
                  value:
                    message: >-
                      These recipients sign through a single-use signing URL, so no signing email
                      can be sent. Use the signing-url endpoint to mint one.
                    type: RecipientRequiresSingleUseUrl
                    error: >-
                      These recipients sign through a single-use signing URL, so no signing email
                      can be sent. Use the signing-url endpoint to mint one.
                    code: RecipientRequiresSingleUseUrl
                    data:
                      recipientIds:
                        - 5f673f37-9912-4e72-85aa-8f3649760f6b
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  status:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to resend signature request emails
              schema:
                type: object
                properties:
                  error:
                    type: string
