  /turbosign/templates/{templateId}/signature-setup:
    get:
      tags:
        - TurboSign
      summary: Get Template Signature Setup
      description: >-
        Lists the signer roles saved on a PDF signature template, with the key to pass as a
        recipient's `role` when you send it. Each role shows whether a saved signer fills it when
        you leave it out.
      parameters:
        - name: templateId
          in: path
          required: true
          description: The template ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The template's signer roles, in signing order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      templateId:
                        type: string
                        format: uuid
                      roles:
                        type: array
                        items:
                          type: object
                          properties:
                            key:
                              type: string
                              description: Value to pass as a recipient's `role`.
                            label:
                              type: string
                              description: Role name shown in TurboDocx.
                            order:
                              type: integer
                            hasSavedSigner:
                              type: boolean
                            defaultName:
                              type: string
                              description: Saved signer's name. Only when `hasSavedSigner` is `true`.
                            defaultEmail:
                              type: string
                              description: Saved signer's email. Only when `hasSavedSigner` is `true`.
                            fieldCount:
                              type: integer
              example:
                data:
                  templateId: 0b1099cf-d7b9-41a4-822b-51b68fd4885a
                  roles:
                    - key: client
                      label: Client
                      order: 1
                      hasSavedSigner: false
                      fieldCount: 3
                    - key: countersigner
                      label: Countersigner
                      order: 2
                      hasSavedSigner: true
                      defaultName: Sam Lee
                      defaultEmail: sam@example.com
                      fieldCount: 2
        '400':
          description: '`templateId` is not a valid UUID.'
          content:
            application/json:
              example:
                message: There was an issue validating the params
                type: ValidationError
                data:
                  errors:
                    - message: '"templateId" must be a valid GUID'
                      path:
                        - templateId
                      type: string.guid
                      context:
                        label: templateId
                        key: templateId
                        value: abc
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                label:
                                  type: string
                                key:
                                  type: string
                                value:
                                  type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: >-
            Viewers cannot read signature setups, because the response lists saved signer emails.
            The response has no body.
        '404':
          description: The template does not exist in your organization or has no saved signature setup.
          content:
            application/json:
              example:
                message: No saved signature setup found for this template
                type: SignatureSetupNotFound
                error: No saved signature setup found for this template
                code: SignatureSetupNotFound
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  error:
                    type: string
                  code:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to read the template's signature setup
              schema:
                type: object
                properties:
                  error:
                    type: string
