            file_put_contents('deliverable.docx', $content);
            echo 'Saved deliverable.docx (' . strlen($content) . " bytes)\n";
        - lang: Ruby
          label: SDK
          source: |
            require "turbodocx_sdk"

            TurboDocxSdk::Deliverable.configure(
              api_key: ENV["TURBODOCX_API_KEY"],
              org_id: ENV["TURBODOCX_ORG_ID"]
            )

            content = TurboDocxSdk::Deliverable.download_source_file("YOUR_DELIVERABLE_ID")
            File.binwrite("deliverable.docx", content)
            puts "Saved deliverable.docx (#{content.bytesize} bytes)"
        - lang: Go
          label: SDK
          source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n\n\tturbodocx \"github.com/TurboDocx/SDK/packages/go-sdk\"\n)\n\nfunc main() {\n\tctx := context.Background()\n\n\tclient, err := turbodocx.NewDeliverableClientOnly(turbodocx.ClientConfig{\n\t\tAPIKey: os.Getenv(\"TURBODOCX_API_KEY\"),\n\t\tOrgID:  os.Getenv(\"TURBODOCX_ORG_ID\"),\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\tcontent, err := client.DownloadSourceFile(ctx, \"YOUR_DELIVERABLE_ID\")\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tif err := os.WriteFile(\"deliverable.docx\", content, 0o644); err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Printf(\"Saved deliverable.docx (%d bytes)\\n\", len(content))\n}\n"
