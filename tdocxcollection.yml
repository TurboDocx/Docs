        - lang: Go
          label: SDK
          source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n\n\tturbodocx \"github.com/TurboDocx/SDK/packages/go-sdk\"\n)\n\nfunc main() {\n\tctx := context.Background()\n\n\tclient, err := turbodocx.NewWebhooksClientWithConfig(turbodocx.ClientConfig{\n\t\tAPIKey: os.Getenv(\"TURBODOCX_API_KEY\"),\n\t\tOrgID:  os.Getenv(\"TURBODOCX_ORG_ID\"),\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t// Sends a test delivery to every configured URL\n\tresult, err := client.TestWebhook(ctx, turbodocx.TestWebhookRequest{\n\t\tEventType: \"signature.document.completed\",\n\t\tPayload: map[string]interface{}{\n\t\t\t\"documentId\":   \"YOUR_DOCUMENT_ID\",\n\t\t\t\"documentName\": \"Service Agreement\",\n\t\t},\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Printf(\"%+v\\n\", result[\"summary\"])\n}\n"
