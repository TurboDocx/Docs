      responses:
        '200':
          description: The document is ready for review.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  documentId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    description: '`review_ready`.'
                    example: review_ready
                  previewUrl:
                    type: string
                    format: uri
                    description: Page in TurboDocx to review fields and send.
                  recipients:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        name:
                          type: string
                        email:
                          type: string
                        metadata:
                          type: object
                  message:
                    type: string
              example:
                success: true
                documentId: 4a20eca5-7944-430c-97d5-fcce4be24296
                status: review_ready
                previewUrl: >-
                  https://app.turbodocx.com/e-signature/assign-fields/4a20eca5-7944-430c-97d5-fcce4be24296
                recipients:
                  - id: 5f673f37-9912-4e72-85aa-8f3649760f6b
                    name: John Smith
                    email: john.smith@example.com
                    metadata: {}
                message: Document prepared for review. Use the preview URL to review and assign fields.
        '400':
          description: >-
            The request is invalid: a validation failure, no file source or more than one, malformed
            JSON in `recipients` or `fields`, a field or recipient problem (for example
            `FieldsRequired` or `UnknownSignerRole`), or a contradictory reminder and expiration
            schedule.
          content:
            application/json:
              examples:
                validation:
                  summary: Invalid request body
                  value:
                    message: There was an issue validating the body
                    type: ValidationError
                    data:
                      errors:
                        - message: '"recipients" is required'
                          path:
                            - recipients
                          type: any.required
                          context:
                            label: recipients
                            key: recipients
                signatureError:
                  summary: Signature request error
                  value:
                    message: >-
                      fields is required. Leave it out only when sending a templateId whose
                      recipients name a role (recipients[].role).
                    type: FieldsRequired
                    error: >-
                      fields is required. Leave it out only when sending a templateId whose
                      recipients name a role (recipients[].role).
                    code: FieldsRequired
                schedule:
                  summary: Contradictory schedule
                  value:
                    message: >-
                      The first reminder would be due at or after the document expires, so no
                      reminder would ever be sent. Set it below 2 days.
                    error: InvalidSignatureSchedule
                    data:
                      code: ReminderDelayExceedsExpiry
                      fields:
                        - reminderDelay
                        - expireAfter
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                label:
                                  type: string
                                key:
                                  type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '402':
          description: >-
            Your organization has used all of its signature credits (`SignatureLimitExceeded`), or
            the plan does not include the requested verification (`OtpNotEntitled`,
            `SmsOtpLimitExceeded`).
          content:
            application/json:
              examples:
                creditLimit:
                  summary: Out of signature credits
                  value:
                    message: >-
                      You have reached your signature limit. Please upgrade your plan for more
                      signatures.
                    type: SignatureLimitExceeded
                verification:
                  summary: Verification not on the plan
                  value:
                    message: SMS verification requires a Pro or Enterprise plan.
                    type: OtpNotEntitled
                    error: SMS verification requires a Pro or Enterprise plan.
                    code: OtpNotEntitled
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
        '403':
          description: >-
            The key's role cannot send documents (viewers cannot; no body), or the organization has
            not turned on a verification mode the request uses (JSON body).
          content:
            application/json:
              example:
                message: >-
                  This organization does not allow changing the identity-verification method. Omit
                  otpChannel or set it to 'email'.
                type: OtpOverrideNotAllowed
                error: >-
                  This organization does not allow changing the identity-verification method. Omit
                  otpChannel or set it to 'email'.
                code: OtpOverrideNotAllowed
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  error:
                    type: string
                  code:
                    type: string
        '409':
          description: >-
            A recipient resolves to SMS verification but your organization has no SMS provider
            saved.
          content:
            application/json:
              example:
                message: SMS verification is not configured for this organization.
                type: SmsProviderNotConfigured
                error: SMS verification is not configured for this organization.
                code: SmsProviderNotConfigured
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  error:
                    type: string
                  code:
                    type: string
        '500':
          description: An unexpected server error. Nothing is wrong with your request.
          content:
            application/json:
              example:
                error: An unexpected error occurred while preparing the document for review
                code: UnexpectedError
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
