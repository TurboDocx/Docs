  /turbosign/documents/{documentId}/signing-url:
    post:
      tags:
        - Embedded Signing
      summary: Create Embedded Signing URL
      description: >-
        Returns a signing URL for one signer of a sent document, to open, redirect to or show in an
        iframe in your app. Request it when the signer is ready and never store it; for external
        identity verification, pass your provider's result in `identityAssertion`.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send exactly one of `recipientId` or `externalId`. Unknown keys are rejected.
              properties:
                recipientId:
                  type: string
                  format: uuid
                  description: The recipient's TurboDocx ID.
                externalId:
                  type: string
                  maxLength: 256
                  description: The `externalId` you set on the recipient.
                returnUrl:
                  type: string
                  format: uri
                  description: >-
                    `https` URL the signer returns to after signing. Omitting it clears one set
                    earlier.
                identityAssertion:
                  type: object
                  description: >-
                    Required for a recipient using `external_idv`: your provider's verification of
                    the signer.
                  required:
                    - provider
                    - verificationId
                    - verifiedAt
                    - subjectEmail
                  properties:
                    provider:
                      type: string
                      minLength: 1
                      maxLength: 200
                      description: Must match the recipient's `provider`.
                    verificationId:
                      type: string
                      minLength: 1
                      maxLength: 256
                      description: Your provider's ID for this verification. Each can be used once.
                    verifiedAt:
                      type: string
                      format: date-time
                      description: When the signer was verified (ISO 8601).
                    subjectEmail:
                      type: string
                      format: email
                      description: Email of the verified person. Must match the recipient's email.
                    method:
                      type: string
                      enum:
                        - id_document
                        - id_document_liveness
                        - kba
                        - database
                        - sso
                        - other
                      description: How the signer was verified.
                    methodDetail:
                      type: string
                      maxLength: 200
                      description: Required when `method` is `other`.
                    assuranceLevel:
                      type: string
                      maxLength: 40
                    verifiedName:
                      type: string
                      maxLength: 200
                    evidenceUrl:
                      type: string
                      format: uri
                      maxLength: 2048
                      description: '`https` link to the verification record.'
                    overrideEmailMatching:
                      type: boolean
                      default: false
                      description: >-
                        Set to `true` to accept a `subjectEmail` that differs from the recipient's
                        email.
                      enum:
                        - true
                        - false
            example:
              recipientId: 5f673f37-9912-4e72-85aa-8f3649760f6b
              returnUrl: https://app.example.com/signed
      responses:
        '200':
          description: The signing URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          url:
                            type: string
                            format: uri
                          expiresAt:
                            type: string
                            format: date-time
                            nullable: true
                            description: >-
                              About five minutes after issue for a single-use URL; otherwise the
                              document's expiry or `null`.
                          recipientId:
                            type: string
                            format: uuid
                          externalId:
                            type: string
                            nullable: true
                          identityVerificationMode:
                            type: string
                            enum:
                              - otp
                              - external_idv
                              - override
                            nullable: true
                          pendingChecks:
                            type: array
                            description: Passcode step the signer must clear. Empty for other modes.
                            items:
                              type: string
                              enum:
                                - email_otp
                                - sms_otp
              example:
                data:
                  results:
                    url: >-
                      https://www.turbodocx.com/e-signature/embed/4a20eca5-7944-430c-97d5-fcce4be24296?sut=abc123
                    expiresAt: '2026-01-15T10:40:00.000Z'
                    recipientId: 5f673f37-9912-4e72-85aa-8f3649760f6b
                    externalId: customer_123
                    identityVerificationMode: override
                    pendingChecks: []
        '400':
          description: >-
            The body is invalid, it does not name exactly one recipient
            (`RecipientSelectorInvalid`), `returnUrl` is not https (`InvalidReturnUrl`), or the
            identity assertion is missing or fails a check.
          content:
            application/json:
              examples:
                selector:
                  summary: No single recipient selector
                  value:
                    message: Provide exactly one of recipientId or externalId
                    type: RecipientSelectorInvalid
                    error: Provide exactly one of recipientId or externalId
                    code: RecipientSelectorInvalid
                validation:
                  summary: Unknown key
                  value:
                    message: There was an issue validating the body
                    type: ValidationError
                    data:
                      errors:
                        - message: '"senderName" is not allowed'
                          path:
                            - senderName
                          type: object.unknown
                          context:
                            label: senderName
                            key: senderName
                            value: Jane
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  error:
                    type: string
                  code:
                    type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: >-
            The key's role is not administrator or contributor (no body), or your organization has
            not turned on embedded signing or the identity mode the recipient uses (JSON body).
          content:
            application/json:
              example:
                message: Embedded signing is not enabled for this organization
                type: EmbeddedSigningNotEnabled
                error: Embedded signing is not enabled for this organization
                code: EmbeddedSigningNotEnabled
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  error:
                    type: string
                  code:
                    type: string
        '404':
          description: The document does not exist in your organization, or no recipient matches the selector.
          content:
            application/json:
              examples:
                document:
                  summary: Document not found
                  value:
                    message: Document not found
                    type: DocumentNotFound
                recipient:
                  summary: Recipient not found
                  value:
                    message: Recipient not found
                    type: RecipientNotFound
                    error: Recipient not found
                    code: RecipientNotFound
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
        '409':
          description: >-
            The document can no longer be signed (for example it is voided, expired or not sent
            yet), the recipient has already signed, or it is not their turn.
          content:
            application/json:
              example:
                message: This document can no longer be signed
                type: DocumentNotSignable
                error: This document can no longer be signed
                code: DocumentNotSignable
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  error:
                    type: string
                  code:
                    type: string
