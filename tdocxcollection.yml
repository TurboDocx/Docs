  /api/webhooks/signature/regenerate:
    post:
      tags:
        - Webhooks
      summary: Regenerate Webhook Secret
      description: >-
        Rotate the org's signature webhook HMAC secret. The new secret is returned once; store it
        immediately, since old signatures stop working right away.
      responses:
        '200':
          description: >-
            The full `secret` is only returned here and on [Create
            Webhook](/docs/API/create-webhook); [Get Webhook](/docs/API/get-webhook) only ever
            returns a masked `maskedSecret`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      secret:
                        type: string
                        description: New HMAC signing secret. Shown once only.
                      regeneratedAt:
                        type: string
                        format: date-time
                  message:
                    type: string
              example:
                data:
                  id: b7e2c4a1-3f9d-4e6a-8c1b-5d0f7a2e9c34
                  secret: whsec_REPLACE_WITH_YOUR_WEBHOOK_SECRET
                  regeneratedAt: '2026-05-02T09:20:00.000Z'
                message: >-
                  Webhook secret regenerated successfully. Save the new secret - it won't be shown
                  again.
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator. The response has no body.
        '404':
          description: >-
            No webhook with that name exists in your organization. Response body: `{ "error":
            "Webhook not found" }`
          content:
            application/json: {}
      x-codeSamples:
        - lang: NodeJs
          label: SDK
          source: |
            import { TurboWebhooks } from '@turbodocx/sdk';

            TurboWebhooks.configure({
              apiKey: process.env.TURBODOCX_API_KEY,
              orgId: process.env.TURBODOCX_ORG_ID,
            });

            // The old secret stops working immediately; store the new one
            const result = await TurboWebhooks.regenerateWebhookSecret();
            console.log(result.secret);
        - lang: Python
          label: SDK
          source: |
            import asyncio
            import os

            from turbodocx_sdk import TurboWebhooks

            TurboWebhooks.configure(
                api_key=os.environ["TURBODOCX_API_KEY"],
                org_id=os.environ["TURBODOCX_ORG_ID"],
            )


