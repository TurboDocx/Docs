  /turbosign/documents/{documentId}/recipients:
    get:
      tags:
        - TurboSign
      summary: Get Document Recipients
      description: >-
        Returns every recipient on a document with their signing status, email history and who sent
        the document. Use `effectiveStatus` to see who you are still waiting on, because it also
        reflects a voided or expired document.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The document's recipients, ordered by `signingOrder`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      document:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                          status:
                            type: string
                            enum:
                              - draft
                              - setup_complete
                              - review_ready
                              - under_review
                              - finalizing
                              - completed
                              - finalization_failed
                              - voided
                              - expired
                          createdOn:
                            type: string
                            format: date-time
                          sentOn:
                            type: string
                            format: date-time
                            nullable: true
                            description: When the document was sent, or `null` while it is a draft.
                          expiresAt:
                            type: string
                            format: date-time
                            nullable: true
                          sentBy:
                            type: object
                            properties:
                              name:
                                type: string
                              email:
                                type: string
                      recipients:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            email:
                              type: string
                            status:
                              type: string
                              enum:
                                - pending
                                - viewed
                                - completed
                              description: >-
                                Raw recipient status. An unsigned signer on a voided or expired
                                document still reads `pending`.
                            effectiveStatus:
                              type: string
                              enum:
                                - pending
                                - viewed
                                - completed
                                - voided
                                - expired
                              description: >-
                                Status with the document's outcome applied. Use this for display and
                                follow-up.
                            signedOn:
                              type: string
                              format: date-time
                              nullable: true
                            signingOrder:
                              type: integer
                            delivery:
                              type: object
                              description: Emails sent to this recipient. CC emails are not counted.
                              properties:
                                firstSentOn:
                                  type: string
                                  format: date-time
                                  nullable: true
                                lastSentOn:
                                  type: string
                                  format: date-time
                                  nullable: true
                                totalSent:
                                  type: integer
                                  description: >-
                                    All emails: request, resends, reminders, warnings and final
                                    notices.
                                reminderCount:
                                  type: integer
                                  description: Scheduled reminders only. A manual reminder does not count here.
                                lastRemindedAt:
                                  type: string
                                  format: date-time
                                  nullable: true
                                  description: >-
                                    When the reminder clock was last reset. Set by the first send
                                    too, so it is not proof of a reminder.
                                warningCount:
                                  type: integer
                                  description: Expiry warnings sent.
                                lastWarningAt:
                                  type: string
                                  format: date-time
                                  nullable: true
                      summary:
                        type: object
                        description: >-
                          Recipient counts by `effectiveStatus`, plus `waitingOn` (pending and
                          viewed).
                        properties:
                          total:
                            type: integer
                          pending:
                            type: integer
                          viewed:
                            type: integer
                          completed:
                            type: integer
                          voided:
                            type: integer
                          expired:
                            type: integer
                          waitingOn:
                            type: integer
              example:
                data:
                  document:
                    id: 4a20eca5-7944-430c-97d5-fcce4be24296
                    name: Service Agreement
                    status: under_review
                    createdOn: '2026-01-15T10:30:00.000Z'
                    sentOn: '2026-01-15T10:35:00.000Z'
                    expiresAt: null
                    sentBy:
                      name: Jane Sender
                      email: sender@example.com
                  recipients:
                    - id: 5f673f37-9912-4e72-85aa-8f3649760f6b
                      name: John Smith
                      email: john.smith@example.com
                      status: completed
                      effectiveStatus: completed
                      signedOn: '2026-01-16T14:02:00.000Z'
                      signingOrder: 1
                      delivery:
                        firstSentOn: '2026-01-15T10:35:00.000Z'
                        lastSentOn: '2026-01-15T10:35:00.000Z'
                        totalSent: 1
                        reminderCount: 0
                        lastRemindedAt: '2026-01-15T10:35:00.000Z'
                        warningCount: 0
                        lastWarningAt: null
                    - id: 7a891c23-4d56-4e78-9abc-def012345678
                      name: Jane Doe
                      email: jane.doe@example.com
                      status: pending
                      effectiveStatus: pending
                      signedOn: null
                      signingOrder: 2
                      delivery:
                        firstSentOn: '2026-01-16T14:02:05.000Z'
                        lastSentOn: '2026-01-20T09:00:00.000Z'
                        totalSent: 2
                        reminderCount: 1
                        lastRemindedAt: '2026-01-20T09:00:00.000Z'
                        warningCount: 0
                        lastWarningAt: null
                  summary:
                    total: 2
                    pending: 1
                    viewed: 0
                    completed: 1
