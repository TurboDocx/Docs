  /api/webhooks:
    post:
      tags:
        - Webhooks
      summary: Create Webhook
      description: >-
        Register a new signature webhook for your org. The SDK always sends name="signature". The
        returned secret is shown once; store it immediately.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Webhook name. The SDK always sends "signature".
                  example: signature
                urls:
                  type: array
                  description: One or more HTTPS endpoints to receive event payloads. HTTP URLs are rejected.
                  items:
                    type: string
                  example:
                    - https://example.com/webhooks/turbodocx
                events:
                  type: array
                  description: List of event types to subscribe to.
                  items:
                    type: string
                  example:
                    - signature.document.completed
                    - signature.document.voided
              required:
                - name
                - urls
                - events
      responses:
        '201':
          description: >-
            `secret` is only ever returned in full on create and on [Regenerate Webhook
            Secret](/docs/API/regenerate-webhook-secret); every other endpoint returns a masked
            `maskedSecret` instead. Use `secret` to verify the `X-TurboDocx-Signature` header on
            incoming webhook calls.
          content:
            application/json:
              example:
                data:
                  id: b7e2c4a1-3f9d-4e6a-8c1b-5d0f7a2e9c34
                  orgId: a1b2c3d4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                  name: signature
                  urls:
                    - https://example.com/webhooks/turbodocx
                  events:
                    - signature.document.completed
                    - signature.document.voided
                  secret: whsec_REPLACE_WITH_YOUR_WEBHOOK_SECRET
                  isActive: true
                  createdBy: f5e6d7c8-9a0b-4c1d-2e3f-4a5b6c7d8e9f
                  createdOn: '2026-05-01T14:22:10.000Z'
                  updatedOn: '2026-05-01T14:22:10.000Z'
                  secretExists: true
                message: Webhook created successfully. Save the secret - it won't be shown again.
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                      orgId:
                        type: string
                      name:
                        type: string
                      urls:
                        type: array
                        items:
                          type: string
                      events:
                        type: array
                        items:
                          type: string
                      secret:
                        type: string
                      isActive:
                        type: boolean
                      createdBy:
                        type: string
                      createdOn:
                        type: string
                      updatedOn:
                        type: string
                      secretExists:
                        type: boolean
                  message:
                    type: string
        '400':
          description: >-
            `name`, `urls`, or `events` is missing or invalid, or any URL is not HTTPS. Response
            body: `{ "message", "type": "ValidationError", "data": { "errors": [...] } }`
          content:
            application/json: {}
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator. The response has no body.
        '409':
          description: >-
            A webhook named `signature` already exists in your organization. Response body: `{
            "message", "error": "WebhookNameTaken", "data": { "constraint", "orgId", "name" } }`
          content:
            application/json: {}
      x-codeSamples:
        - lang: NodeJs
          label: SDK
          source: >
            import { TurboWebhooks } from '@turbodocx/sdk';


            TurboWebhooks.configure({
              apiKey: process.env.TURBODOCX_API_KEY,
              orgId: process.env.TURBODOCX_ORG_ID,
            });


            // The SDK always names the webhook "signature". Store the secret: it is shown only
            once.

            const webhook = await TurboWebhooks.createWebhook({
              urls: ['https://example.com/webhooks/turbodocx'],
              events: ['signature.document.completed', 'signature.document.voided'],
            });

            console.log(webhook.id, webhook.secret);
        - lang: Python
          label: SDK
          source: |
            import asyncio
            import os

            from turbodocx_sdk import TurboWebhooks

            TurboWebhooks.configure(
                api_key=os.environ["TURBODOCX_API_KEY"],
                org_id=os.environ["TURBODOCX_ORG_ID"],
            )


            async def main():
                # The SDK always names the webhook "signature". Store the secret: it is shown only once.
                webhook = await TurboWebhooks.create_webhook(
                    urls=["https://example.com/webhooks/turbodocx"],
                    events=["signature.document.completed", "signature.document.voided"],
                )
                print(webhook["id"], webhook["secret"])


            asyncio.run(main())
        - lang: PHP
