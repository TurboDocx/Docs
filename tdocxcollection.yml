              org_id: ENV["TURBODOCX_ORG_ID"],
              sender_email: "sender@example.com",
              sender_name: "Your Company"
            )


            # Omit the recipient list to remind every signer whose turn it is

            result = TurboDocxSdk::TurboSign.send_reminder("YOUR_DOCUMENT_ID",
            ["YOUR_RECIPIENT_ID"])

            p result["results"]
        - lang: Go
          label: SDK
          source: "package main\n\nimport (\n\t\"context\"\n\t\"fmt\"\n\t\"log\"\n\t\"os\"\n\n\tturbodocx \"github.com/TurboDocx/SDK/packages/go-sdk\"\n)\n\nfunc main() {\n\tctx := context.Background()\n\n\tclient, err := turbodocx.NewClientWithConfig(turbodocx.ClientConfig{\n\t\tAPIKey:      os.Getenv(\"TURBODOCX_API_KEY\"),\n\t\tOrgID:       os.Getenv(\"TURBODOCX_ORG_ID\"),\n\t\tSenderEmail: \"sender@example.com\",\n\t\tSenderName:  \"Your Company\",\n\t})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\n\t// Pass nil instead of the slice to remind every signer whose turn it is\n\tresult, err := client.TurboSign.SendReminder(ctx, \"YOUR_DOCUMENT_ID\", []string{\"YOUR_RECIPIENT_ID\"})\n\tif err != nil {\n\t\tlog.Fatal(err)\n\t}\n\tfmt.Printf(\"%+v\\n\", result.Results)\n}\n"
  /turbosign/documents/{documentId}/download:
    get:
      tags:
        - TurboSign
      summary: Download Signed Document
      description: >-
        Returns a temporary download link for the signed PDF of a completed document, valid for one
        hour. The response is JSON with the link, not the file itself.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A presigned URL for the signed PDF.
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                    description: Link to the signed PDF. Expires after one hour.
                  fileName:
                    type: string
                    description: The document name with a `.pdf` extension.
              example:
                downloadUrl: https://storage.example.com/signed/Service%20Agreement.pdf?X-Amz-Signature=abc123
                fileName: Service Agreement.pdf
        '400':
          description: The document is voided or is not completed yet.
          content:
            application/json:
              examples:
                notCompleted:
                  summary: Not completed
                  value:
                    error: Document is not completed yet
                voided:
                  summary: Voided
                  value:
                    error: Document has been voided and cannot be downloaded
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '404':
          description: The document does not exist in your organization, or its PDF file cannot be found.
          content:
            application/json:
              example:
                error: Document not found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to download document
              schema:
                type: object
                properties:
                  error:
                    type: string
