  /turbosign/documents/signature-documents:
    get:
      tags:
        - TurboSign
      summary: List Signature Documents
      description: >-
        Returns a page of your organization's signature documents with their recipients, most
        recently updated first. Filter by status, a date range on the last update, or a search
        across document name, recipient name or email, and sender.
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of documents to return. Values outside 1 to 100 are clamped.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 5
        - name: offset
          in: query
          required: false
          description: Number of documents to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: query
          in: query
          required: false
          description: >-
            Search text matched against document name, recipient name or email, and sender name or
            email.
          schema:
            type: string
        - name: status
          in: query
          required: false
          description: >-
            Only return these statuses, comma separated (for example `under_review,completed`).
            Omitted returns every status. Allowed values: `draft`, `setup_complete`, `review_ready`,
            `under_review`, `finalizing`, `completed`, `finalization_failed`, `voided`, `expired`.
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: ISO 8601 date. Only documents last updated on or after it.
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: >-
            ISO 8601 date. Only documents last updated on or before it. Must not be before
            `startDate`.
          schema:
            type: string
            format: date-time
        - name: sortBy
          in: query
          required: false
          description: >-
            Sort field. An unknown value falls back to `updatedOn`. `createdBy` sorts by the
            sender's last name.
          schema:
            type: string
            enum:
              - name
              - createdOn
              - updatedOn
              - status
              - createdBy
            default: updatedOn
        - name: sortDirection
          in: query
          required: false
          description: Sort direction.
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: A page of signature documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      documents:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            name:
                              type: string
                            description:
                              type: string
                              nullable: true
                            status:
                              type: string
                              enum:
                                - draft
                                - setup_complete
                                - review_ready
                                - under_review
                                - finalizing
                                - completed
                                - finalization_failed
                                - voided
                                - expired
                            pdfFileId:
                              type: string
                              format: uuid
                            createdBy:
                              type: string
                              format: uuid
                            createdOn:
                              type: string
                              format: date-time
                            updatedOn:
                              type: string
                              format: date-time
                            expiresAt:
                              type: string
                              format: date-time
                              nullable: true
                            recipients:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    format: uuid
                                  name:
                                    type: string
                                  email:
                                    type: string
                                  status:
                                    type: string
                                    enum:
                                      - pending
                                      - viewed
                                      - completed
                                  signingOrder:
                                    type: integer
                            metadata:
                              type: object
                              description: >-
                                Document details such as the sender and the reminder and expiration
                                settings.
                      totalRecords:
                        type: integer
                        description: Total documents matching the filters.
              example:
                data:
                  documents:
                    - id: 4a20eca5-7944-430c-97d5-fcce4be24296
                      name: Service Agreement
                      description: Please review and sign.
                      status: under_review
                      pdfFileId: 9c1e2d3f-4a5b-4c6d-8e7f-0a1b2c3d4e5f
                      createdBy: f5e6d7c8-9a0b-4c1d-8e3f-4a5b6c7d8e9f
                      createdOn: '2026-01-15T10:30:00.000Z'
                      updatedOn: '2026-01-15T10:35:00.000Z'
                      expiresAt: null
                      recipients:
                        - id: 5f673f37-9912-4e72-85aa-8f3649760f6b
                          name: John Smith
                          email: john.smith@example.com
                          status: pending
                          signingOrder: 1
                      metadata:
                        senderName: Jane Sender
                        senderEmail: sender@example.com
                  totalRecords: 1
        '400':
          description: '`startDate` or `endDate` is not a valid date, or `startDate` is after `endDate`.'
          content:
            application/json:
              example:
                error: Invalid startDate format. Expected ISO 8601 date string.
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to fetch signature documents
              schema:
                type: object
                properties:
                  error:
                    type: string
  /turbosign/documents/{documentId}/status:
    get:
      tags:
        - TurboSign
      summary: Get Document Status
      description: >-
        Returns a signature document's current status and its expiry deadline. Poll this, or use
        webhooks, to learn when a document is completed.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The document's status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - draft
                          - setup_complete
                          - review_ready
                          - under_review
                          - finalizing
                          - completed
                          - finalization_failed
                          - voided
                          - expired
                      expiresAt:
                        type: string
                        format: date-time
                        nullable: true
                        description: When the signing window closes, or `null` when the document never expires.
              example:
                data:
                  status: under_review
                  expiresAt: '2026-02-14T10:35:00.000Z'
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '404':
          description: The document does not exist, was deleted, or belongs to another organization.
          content:
            application/json:
              example:
                error: Document not found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to fetch document status
              schema:
                type: object
                properties:
                  error:
                    type: string
