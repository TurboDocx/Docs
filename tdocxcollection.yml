    post:
      tags:
        - Deliverables
      summary: Generate Deliverable
      description: >-
        Generates a new document from a template by filling its placeholders with the variable
        values you send, and stores it as a deliverable with a PDF copy. The response includes a
        `placeholderReport` listing template placeholders you sent no value for and values you sent
        that the template does not use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - templateId
                - variables
              properties:
                name:
                  type: string
                  minLength: 3
                  maxLength: 255
                  description: Name of the new deliverable.
                  example: Employee Contract - John Smith
                templateId:
                  type: string
                  format: uuid
                  description: >-
                    The template to generate from. A PDF signature template cannot generate
                    documents and returns `400 SignatureOnlyTemplate`.
                  example: 0b1099cf-d7b9-41a4-822b-51b68fd4885a
                description:
                  type: string
                  maxLength: 65535
                  nullable: true
                  description: Description of the deliverable.
                deliverableFolderId:
                  type: string
                  format: uuid
                  description: Folder to place the deliverable in.
                variables:
                  type: array
                  description: >-
                    Values for the template's placeholders. Required, but may be an empty array; a
                    placeholder with no value renders blank unless `strict` is `true`.
                  items:
                    type: object
                    required:
                      - placeholder
                      - mimeType
                    properties:
                      placeholder:
                        type: string
                        maxLength: 255
                        description: >-
                          The placeholder exactly as it appears in the template, for example
                          `{CompanyName}`.
                        example: '{EmployeeName}'
                      text:
                        type: string
                        description: >-
                          The value to insert. Required unless the variable has a `variableStack` or
                          `isDisabled` is `true`.
                        example: John Smith
                      mimeType:
                        type: string
                        enum:
                          - text
                          - html
                          - image
                          - markdown
                        description: How `text` is interpreted.
                      isDisabled:
                        type: boolean
                        default: false
                        description: Set to `true` to skip this variable during generation.
                        enum:
                          - true
                          - false
                      subvariables:
                        type: array
                        description: >-
                          Values for placeholders that appear inside this variable's HTML `text`.
                          The parent must have `mimeType: html`.
                        items:
                          type: object
                          properties:
                            placeholder:
                              type: string
                              example: '{contactName}'
                            text:
                              type: string
                              example: Jane Doe
                            mimeType:
                              type: string
                              enum:
                                - text
                                - html
                                - image
                                - markdown
                      variableStack:
                        type: object
                        description: >-
                          Repeating content: several values for the same placeholder, keyed by
                          position (`"0"`, `"1"`, ...). An array of the same objects is also
                          accepted.
                        additionalProperties:
                          type: object
                          properties:
                            text:
                              type: string
                            mimeType:
                              type: string
                              enum:
                                - text
                                - html
                                - image
                                - markdown
                            subvariables:
                              type: array
                              items:
                                type: object
                                properties:
                                  placeholder:
                                    type: string
                                  text:
                                    type: string
                                  mimeType:
                                    type: string
                      aiPrompt:
                        type: string
                        maxLength: 16000
                        description: Prompt used to generate the value with AI.
                tags:
                  type: array
                  maxItems: 50
                  description: Tag labels (1 to 255 characters each) to attach to the deliverable.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 255
                strict:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Set to `true` to refuse generation with `400 PlaceholderMismatch` when any
                    template placeholder has no value or any value names a placeholder the template
                    does not have. Omitted means generate anyway.
                replaceFonts:
                  type: boolean
                  default: false
                  description: Set to `true` to replace the document's fonts with `defaultFont`.
                  enum:
                    - true
                    - false
                defaultFont:
                  type: string
                  nullable: true
                  description: Font to use. When omitted, the template's own default font is used.
                fonts:
                  type: array
                  description: Fonts used by the document. Each entry has exactly `name` and `usage`.
                  items:
                    type: object
                    required:
                      - name
                      - usage
                    properties:
                      name:
                        type: string
                      usage:
                        type: string
            example:
              templateId: 0b1099cf-d7b9-41a4-822b-51b68fd4885a
              name: Employee Contract - John Smith
              description: Employment contract for new senior developer
              variables:
                - placeholder: '{EmployeeName}'
                  text: John Smith
                  mimeType: text
                - placeholder: '{CompanyName}'
                  text: Example Corp
                  mimeType: text
              tags:
                - hr
                - contract
      responses:
        '200':
          description: The deliverable was generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: object
                        properties:
                          deliverable:
                            type: object
                            properties:
                              id:
                                type: string
                                format: uuid
                              name:
                                type: string
                              description:
                                type: string
                              templateId:
                                type: string
                                format: uuid
                              createdBy:
                                type: string
                                format: uuid
                              createdOn:
                                type: string
                                format: date-time
                              updatedOn:
                                type: string
                                format: date-time
                              isActive:
                                type: boolean
                              defaultFont:
                                type: string
                              fonts:
                                type: array
                                nullable: true
                                items:
                                  type: object
                          placeholderReport:
                            type: object
                            properties:
                              missing:
                                type: array
                                description: Template placeholders you sent no value for. They render empty.
                                items:
                                  type: string
                              unknown:
                                type: array
                                description: >-
                                  Placeholders you sent that the template does not contain. They are
                                  ignored.
                                items:
                                  type: string
              example:
                data:
                  results:
                    deliverable:
                      id: 39697685-ca00-43b8-92b8-7722544c574f
                      name: Employee Contract - John Smith
                      description: Employment contract for new senior developer
                      templateId: 0b1099cf-d7b9-41a4-822b-51b68fd4885a
                      createdBy: f5e6d7c8-9a0b-4c1d-8e3f-4a5b6c7d8e9f
                      createdOn: '2026-01-15T14:12:10.721Z'
                      updatedOn: '2026-01-15T14:12:10.721Z'
                      isActive: true
                      defaultFont: Arial
                      fonts: null
                    placeholderReport:
                      missing:
                        - '{StartDate}'
                      unknown: []
        '400':
          description: >-
            The request is invalid, `strict` is on and the placeholders do not match, the template
            is a PDF signature template, or your plan's deliverable or storage limit is reached.
          content:
            application/json:
              examples:
                validation:
                  summary: Invalid request body
                  value:
                    message: There was an issue validating the body
                    type: ValidationError
                    data:
                      errors:
                        - message: '"name" length must be at least 3 characters long'
                          path:
                            - name
                          type: string.min
                          context:
                            limit: 3
                            value: ab
                            label: name
                            key: name
                placeholderMismatch:
                  summary: Strict mode refused the request
                  value:
                    error: PlaceholderMismatch
                    message: 'No value for: {StartDate}. Not in the template: {Salary}.'
                signatureOnlyTemplate:
                  summary: PDF signature template
                  value:
                    error: SignatureOnlyTemplate
                    message: >-
                      PDF templates can only be used to collect signatures, not to generate
                      documents.
                planLimit:
                  summary: Plan limit reached
                  value:
                    message: You have approached the limit of deliverables for your plan.
                    type: InsufficientnumGeneratedDeliverables
                    data:
                      explanation: Please upgrade your subscription to add additional Deliverables.
                      context: ''
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                limit:
                                  type: integer
                                value:
                                  type: string
                                label:
                                  type: string
                                key:
                                  type: string
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: >-
            The key's role cannot generate documents (viewers cannot), or your organization's usage
            record could not be found. The response has no body.
        '404':
          description: The template does not exist in your organization.
          content:
            application/json:
              example:
                error: TemplateNotFound
                message: Template with id 0b1099cf-d7b9-41a4-822b-51b68fd4885a not found
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '423':
          description: Someone is editing the template in TurboDocx. Retry once they have finished.
          content:
            application/json:
              example:
                error: Resource is locked
                message: This template is currently being edited
                data:
                  locked: true
                  lockedBy: f5e6d7c8-9a0b-4c1d-8e3f-4a5b6c7d8e9f
                  lockedOn: '2026-01-15T14:10:00.000Z'
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      locked:
                        type: boolean
                      lockedBy:
                        type: string
                      lockedOn:
                        type: string
        '499':
          description: >-
            The client disconnected before generation finished. Any partly created deliverable is
            cleaned up.
          content:
            application/json:
              example:
                error: Request cancelled
                message: Deliverable generation was cancelled during processing
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
