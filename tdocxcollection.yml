            use TurboDocx\TurboWebhooks;


            TurboWebhooks::configureFromCredentials(
                apiKey: getenv('TURBODOCX_API_KEY') ?: '',
                orgId: getenv('TURBODOCX_ORG_ID') ?: '',
            );


