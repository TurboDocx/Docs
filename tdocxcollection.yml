                language:
                  type: string
                  enum:
                    - en
                    - fr
                    - es
                    - pt
                  description: Language of the emails. Defaults to your organization's preference, then `en`.
                remindersEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Send reminder emails to signers who have not signed. Omitted means your
