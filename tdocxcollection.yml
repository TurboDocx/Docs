  /turbosign/documents/{documentId}/send-reminder:
    post:
      tags:
        - TurboSign
      summary: Send Signing Reminder
      description: >-
        Sends a reminder email now to signers whose turn it is, even when scheduled reminders are
        off or capped, and without counting against the cap. The response reports each recipient
        considered, including those skipped.
      parameters:
        - name: documentId
          in: path
          required: true
          description: The signature document ID.
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  description: >-
                    Recipients to remind. Omit the key to remind everyone whose turn it is; if
                    present it needs at least one ID.
                  items:
                    type: string
                    format: uuid
                  example:
                    - 5f673f37-9912-4e72-85aa-8f3649760f6b
            example: {}
      responses:
        '200':
          description: One result per recipient considered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            recipientId:
                              type: string
                              format: uuid
                            status:
                              type: string
                              enum:
                                - sent
                                - failed
                                - skipped_completed
                                - skipped_wrong_order
                                - skipped_not_due
                                - skipped_max_reached
                                - skipped_disabled
                                - skipped_claim_lost
                            reminderCount:
                              type: integer
                              description: Reminder count after the send. Only set when `sent`.
                            phase:
                              type: string
                              enum:
                                - reminder
                                - expiring
                              description: Which email copy was used.
              example:
                data:
                  results:
                    - recipientId: 5f673f37-9912-4e72-85aa-8f3649760f6b
                      status: sent
                      reminderCount: 2
                      phase: reminder
                    - recipientId: 7a891c23-4d56-4e78-9abc-def012345678
                      status: skipped_wrong_order
        '400':
          description: >-
            `recipientIds` is invalid (for example an empty array), or a named recipient is not a
            current pending signer.
          content:
            application/json:
              examples:
                validation:
                  summary: Empty recipientIds
                  value:
                    message: There was an issue validating the body
                    type: ValidationError
                    data:
                      errors:
                        - message: At least one recipient ID is required
                          path:
                            - recipientIds
                          type: array.min
                          context:
                            label: recipientIds
                            key: recipientIds
                            limit: 1
                            value: []
                notEligible:
                  summary: Some IDs not eligible
                  value:
                    error: Some recipients are not eligible for a reminder at this time
                    invalidRecipientIds:
                      - 7a891c23-4d56-4e78-9abc-def012345678
              schema:
                type: object
                properties:
                  message:
                    type: string
                  type:
                    type: string
                  data:
                    type: object
                    properties:
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                            path:
                              type: array
                              items:
                                type: string
                            type:
                              type: string
                            context:
                              type: object
                              properties:
                                label:
                                  type: string
                                key:
                                  type: string
                                limit:
                                  type: integer
                                value:
                                  type: array
                                  items: {}
        '401':
          description: >-
            Missing or invalid API key, or the organization ID header is missing or is not an
            organization the key belongs to. The response has no body.
        '403':
          description: The key's role cannot send reminders (viewers cannot). The response has no body.
        '404':
          description: The document does not exist, was deleted, or belongs to another organization.
          content:
            application/json:
              example:
                error: Document not found
              schema:
                type: object
                properties:
                  error:
                    type: string
        '409':
          description: >-
            The document is not out for signature (for example voided or expired), or the recipients
            sign only through single-use signing URLs.
          content:
            application/json:
              examples:
                notActionable:
                  summary: Document expired
                  value:
                    error: This document has expired, so its signers can no longer be reminded.
                    code: DocumentNotActionable
                    status: expired
                singleUse:
                  summary: Recipients sign through single-use URLs
                  value:
                    message: >-
                      These recipients sign through a single-use signing URL, so no reminder email
                      can be sent. Use the signing-url endpoint to mint one.
                    type: RecipientRequiresSingleUseUrl
                    error: >-
                      These recipients sign through a single-use signing URL, so no reminder email
                      can be sent. Use the signing-url endpoint to mint one.
                    code: RecipientRequiresSingleUseUrl
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  status:
                    type: string
        '500':
          description: An unexpected server error.
          content:
            application/json:
              example:
                error: Failed to send signature reminders
              schema:
                type: object
                properties:
                  error:
                    type: string
