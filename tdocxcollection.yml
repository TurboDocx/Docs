  /turbosign/single/prepare-for-review:
    post:
      tags:
        - TurboSign
      summary: Prepare Document for Review
      description: >-
        Creates a signature document from a file, deliverable, template or URL and returns a preview
        URL where you check and adjust fields before sending. No email goes to recipients; the
        document waits with status `review_ready` until someone clicks Send in TurboDocx.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - recipients
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    PDF, DOCX or PPTX to send, up to 25 MB. Repeat the `file` part (up to 5 files,
                    25 MB in total) to merge them into one PDF. One file source is required.
                deliverableId:
                  type: string
                  format: uuid
                  description: Send an existing deliverable. One file source is required.
                templateId:
                  type: string
                  format: uuid
                  description: >-
                    Send a template (Word, PowerPoint, or a PDF signature template). Required when
                    any recipient has a `role`. One file source is required.
                fileLink:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: >-
                    Public URL of a PDF, DOCX or PPTX to download and send. One file source is
                    required.
                fileName:
                  type: string
                  maxLength: 255
                  description: File name to use for the uploaded or downloaded file.
                documentName:
                  type: string
                  maxLength: 255
                  description: Document name shown to signers and in TurboDocx.
                documentDescription:
                  type: string
                  maxLength: 1000
                  description: Message included in the signature email.
                recipients:
                  type: array
                  minItems: 1
                  maxItems: 15
                  description: Signers, sent as one JSON-encoded string part.
                  items:
                    type: object
                    required:
                      - name
                      - email
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 255
                        description: Signer's full name.
                        example: John Smith
                      email:
                        type: string
                        format: email
                        description: Signer's email address. Must be unique within the document.
                        example: john.smith@example.com
                      signingOrder:
                        type: integer
                        minimum: 1
                        description: >-
                          Position in the signing sequence, starting at 1 with no gaps. Required
                          unless the recipient has a `role`.
                        example: 1
                      role:
                        type: string
                        description: >-
                          Key of a signer role saved on the template (for example `client`), matched
                          ignoring case. Requires `templateId`; the role's saved fields are placed
                          for this signer.
                      metadata:
                        type: object
                        description: Optional display colors for this signer in the TurboDocx app.
                        properties:
                          color:
                            type: string
                            description: HSL color, for example `hsl(200, 75%, 50%)`.
                          lightColor:
                            type: string
                            description: Light HSL color, for example `hsl(200, 75%, 93%)`.
                      phone:
                        type: string
                        description: >-
                          Signer's mobile number in E.164 format (for example `+15551234567`).
                          Required when the passcode is sent by SMS.
                      externalId:
                        type: string
                        maxLength: 256
                        description: >-
                          Your own identifier for the signer, unique within the document. Lets you
                          request a signing URL by this value.
                      otpChannel:
                        type: string
                        enum:
                          - none
                          - email
                          - sms
                        description: >-
                          How the signer receives a one-time passcode. Omitted means your
                          organization's default. Equivalent to an `identityVerification` block with
                          `mode: otp`.
                      identityVerification:
                        type: object
                        description: >-
                          How the signer proves their identity. Omit it to use your organization's
                          default.
                        required:
                          - mode
                        properties:
                          mode:
                            type: string
                            enum:
                              - otp
                              - external_idv
                              - override
                          channel:
                            type: string
                            enum:
                              - email
                              - sms
                            description: >-
                              For `otp`: how the passcode is delivered. Omitted means your
                              organization's default.
                          provider:
                            type: string
                            description: 'For `external_idv`: the name of your identity verification provider.'
                          maxAgeMinutes:
                            type: integer
                            description: >-
                              For `external_idv`: how old a verification may be when you request the
                              signing URL.
                          overrideIdentityVerification:
                            type: boolean
                            description: >-
                              For `override`: must be `true` to acknowledge that verification is
                              skipped.
                            enum:
                              - true
                              - false
                          reason:
                            type: string
                            description: 'For `override`: why verification is skipped.'
                fields:
                  type: array
                  maxItems: 150
                  description: >-
                    Fields to place, sent as one JSON-encoded string part. Required and non-empty
                    unless a recipient names a template `role`.
                  items:
                    type: object
                    required:
                      - recipientEmail
                      - type
                    description: >-
                      A field placed either by text anchor (`template`) or by coordinates (`page`,
                      `x`, `y`, `width`, `height`).
                    properties:
                      recipientEmail:
                        type: string
                        format: email
                        description: >-
                          Email of the recipient who fills this field. Must match a recipient's
                          `email`.
                        example: john.smith@example.com
                      type:
                        type: string
                        enum:
                          - signature
                          - initial
                          - date
                          - full_name
                          - first_name
                          - last_name
                          - title
                          - company
                          - email
                          - text
                          - checkbox
                        example: signature
                      required:
                        type: boolean
                        nullable: true
                        description: >-
                          Whether the signer must fill the field. Defaults to `true`; `null` counts
                          as `true`. Cannot be `false` on `signature` or `initial` fields, and must
                          be a JSON boolean.
                        enum:
                          - true
                          - false
                      defaultValue:
                        type: string
                        maxLength: 600
                        description: >-
                          Pre-filled value submitted with the signature. Not allowed on `signature`
                          or `initial`. A `checkbox` takes `"true"` or `"false"`; a `date` takes
                          `MM/DD/YYYY`.
                      isReadonly:
                        type: boolean
                        description: Make the field read-only for the signer. Use with `defaultValue`.
                        enum:
                          - true
                          - false
                      isMultiline:
                        type: boolean
                        description: Allow multiple lines in a text field.
                        enum:
                          - true
                          - false
                      backgroundColor:
                        type: string
                        description: >-
                          Background color: hex (`#FFFFFF`), `rgb(255,255,255)`, or a named color
                          such as `white`.
                      metadata:
                        type: object
                        description: Conditional (IF/THEN) field settings. Other keys are kept with the field.
                        properties:
                          fieldKey:
                            type: string
                            maxLength: 100
                            description: >-
                              Stable identifier on a controlling checkbox, referenced by dependent
                              fields.
                          conditional:
                            type: object
                            description: Rule on a dependent field that ties it to a controlling checkbox.
                            required:
                              - controllingFieldKey
                              - operator
                              - action
                            properties:
                              controllingFieldKey:
                                type: string
                                maxLength: 100
                              operator:
                                type: string
                                enum:
                                  - is_checked
                                  - is_not_checked
                              action:
                                type: string
                                enum:
                                  - show
                                  - unlock
                      template:
                        type: object
                        description: Anchor-based placement. Give at least `anchor` or `searchText`.
                        properties:
                          anchor:
                            type: string
                            description: >-
                              Text in the document to place the field on, in single braces, for
                              example `{Signature1}`.
                            example: '{Signature1}'
                          searchText:
                            type: string
                            description: Plain text to search for instead of a braced anchor.
                          placement:
                            type: string
                            enum:
                              - replace
                              - after
                              - before
                              - above
                              - below
                            default: replace
                          size:
                            type: object
                            required:
                              - width
                              - height
                            properties:
                              width:
                                type: number
                                exclusiveMinimum: true
                                minimum: 0
                                example: 200
                              height:
                                type: number
                                exclusiveMinimum: true
                                minimum: 0
                                example: 80
                          offset:
                            type: object
                            required:
                              - x
                              - 'y'
                            properties:
                              x:
                                type: number
                                example: 0
                              'y':
                                type: number
                                example: 0
                          caseSensitive:
                            type: boolean
                            default: false
                            description: Match the anchor case-sensitively.
                            enum:
                              - true
                              - false
                          useRegex:
                            type: boolean
                            default: false
                            description: Treat the anchor as a regular expression.
                            enum:
                              - true
                              - false
                          alignment:
                            type: string
                            enum:
                              - left
                              - center
                              - right
                            nullable: true
                            description: Where the signer's entry sits inside the field.
                      page:
                        type: integer
                        minimum: 1
                        description: 'Coordinate placement: page number, starting at 1.'
                      x:
                        type: number
                        minimum: 0
                        description: 'Coordinate placement: distance from the left edge.'
                      'y':
                        type: number
                        minimum: 0
                        description: 'Coordinate placement: distance from the top edge.'
                      width:
                        type: number
                        exclusiveMinimum: true
                        minimum: 0
                        description: 'Coordinate placement: field width.'
                      height:
                        type: number
                        exclusiveMinimum: true
                        minimum: 0
                        description: 'Coordinate placement: field height.'
                      pageWidth:
                        type: number
                        description: 'Coordinate placement: page width the coordinates were measured on.'
                      pageHeight:
                        type: number
                        description: 'Coordinate placement: page height the coordinates were measured on.'
                      alignment:
                        type: string
                        enum:
                          - left
                          - center
                          - right
                        nullable: true
                        description: Where the signer's entry sits inside the field.
                ccEmails:
                  type: array
                  maxItems: 15
                  uniqueItems: true
                  description: >-
                    Addresses copied on the completed document, sent as one JSON-encoded string
                    part.
                  items:
                    type: string
                    format: email
                senderName:
                  type: string
                  maxLength: 255
                  description: Sender name shown to recipients. Defaults to the name of your API key.
                senderEmail:
                  type: string
                  format: email
                  maxLength: 255
                  description: >-
                    Reply-to address on the signature email and the sender recorded in the audit
                    trail. Strongly recommended; when omitted a generic TurboDocx address is used.
                language:
                  type: string
                  enum:
                    - en
                    - fr
                    - es
                    - pt
                  description: Language of the emails. Defaults to your organization's preference, then `en`.
                remindersEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Send reminder emails to signers who have not signed. Omitted means your
                    organization's default.
                reminderDelay:
                  type: object
                  description: >-
                    Time from a signer's invitation to their first reminder. `unit` is `hours` or
                    `days`; `value` is a whole number from 1 up to 999 days (23976 hours). In
                    multipart, send it as a JSON string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                reminderInterval:
                  type: object
                  description: >-
                    Gap between later reminders. `unit` is `hours` or `days`; `value` is a whole
                    number from 1 up to 999 days (23976 hours). In multipart, send it as a JSON
                    string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                maxReminders:
                  type: integer
                  minimum: -1
                  maximum: 50
                  description: Most reminders per signer. `-1` means unlimited and `0` means none.
                expirationEnabled:
                  type: boolean
                  enum:
                    - true
                    - false
                  description: >-
                    Close the signing window after `expireAfter`. Omitted means your organization's
                    default.
                expireAfter:
                  type: object
                  description: >-
                    How long the document stays signable, counted from sending. `unit` is `hours` or
                    `days`; `value` is a whole number from 1 up to 999 days (23976 hours). In
                    multipart, send it as a JSON string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                expirationWarning:
                  type: object
                  description: >-
                    How long before expiry the warning emails start. `0` means never warn. `unit` is
                    `hours` or `days`; `value` is a whole number from 0 up to 999 days (23976
                    hours). In multipart, send it as a JSON string such as
                    `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 0
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
                expirationWarningInterval:
                  type: object
                  description: >-
                    Gap between warning emails once they start. `unit` is `hours` or `days`; `value`
                    is a whole number from 1 up to 999 days (23976 hours). In multipart, send it as
                    a JSON string such as `{"value":3,"unit":"days"}`.
                  required:
                    - value
                    - unit
                  properties:
                    value:
                      type: integer
                      minimum: 1
                      maximum: 23976
                      example: 3
                    unit:
                      type: string
                      enum:
                        - hours
                        - days
                      example: days
            encoding:
              recipients:
                contentType: application/json
              fields:
                contentType: application/json
              ccEmails:
                contentType: application/json
              reminderDelay:
                contentType: application/json
              reminderInterval:
                contentType: application/json
              expireAfter:
                contentType: application/json
              expirationWarning:
                contentType: application/json
              expirationWarningInterval:
                contentType: application/json
          application/json:
            schema:
              type: object
              required:
