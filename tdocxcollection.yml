  /api/webhooks/signature/test:
    post:
      tags:
        - Webhooks
      summary: Test Webhook
      description: >-
        Send a test event delivery to all URLs configured on the org's signature webhook. Returns a
        summary of delivery results including any per-URL error messages.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  description: The event type to simulate.
                  example: signature.document.completed
                payload:
                  type: object
                  description: Arbitrary JSON payload to include in the test delivery.
                  example:
                    documentId: doc_abc123
                    status: completed
              required:
                - eventType
                - payload
      responses:
        '200':
          description: >-
            If a URL returns a non-2xx status or times out, its entry has `isDelivered: false` and
            `status: "retrying"` (while attempts remain) or `"failed"` (once all attempts are
            exhausted), with details in `errorMessage`. `summary.failed`/`summary.errors` do not
            currently reflect HTTP-level failures; they only count a database error while creating
            the delivery record, so a URL that returns 4xx/5xx or times out through all attempts
            still increments `summary.successful` and leaves `summary.errors` empty. Inspect each
            `deliveries[]` entry's `isDelivered`, `status`, and `errorMessage` to detect a failing
            receiver rather than relying on `summary.failed`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      deliveries:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            webhookId:
                              type: string
                            eventType:
                              type: string
                            httpStatus:
                              type: integer
                              nullable: true
                            isDelivered:
                              type: boolean
                            attemptCount:
                              type: integer
                            deliveredAt:
                              type: string
                              format: date-time
                              nullable: true
                            createdOn:
                              type: string
                              format: date-time
                      summary:
                        type: object
                        properties:
                          total:
                            type: integer
                          successful:
                            type: integer
                          failed:
                            type: integer
                          errors:
                            type: array
                            items:
                              type: string
                  message:
                    type: string
              example:
                data:
                  deliveries:
                    - id: d3a1c2b4-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                      eventType: signature.document.completed
                      url: https://example.com/webhooks/turbodocx
                      httpStatus: 200
                      attemptCount: 1
                      maxAttempts: 3
                      isDelivered: true
                      status: delivered
                  summary:
                    total: 1
                    successful: 1
                    failed: 0
                    errors: []
                message: Test webhook sent successfully to all URLs
        '400':
          description: >-
            The webhook exists but `isActive` is `false`. Response body: `{ "error": "Cannot test
            inactive webhook" }`
          content:
            application/json: {}
        '401':
          description: >-
            Missing or invalid API key/token, or the organization cannot be resolved. The response
            has no body.
        '403':
          description: The key's role is not administrator. The response has no body.
        '404':
          description: >-
            No webhook with that name exists in your organization. Response body: `{ "error":
            "Webhook not found" }`
          content:
            application/json: {}
      x-codeSamples:
        - lang: NodeJs
          label: SDK
          source: |
            import { TurboWebhooks } from '@turbodocx/sdk';

            TurboWebhooks.configure({
              apiKey: process.env.TURBODOCX_API_KEY,
              orgId: process.env.TURBODOCX_ORG_ID,
            });

            // Sends a test delivery to every configured URL
            const result = await TurboWebhooks.testWebhook({
              eventType: 'signature.document.completed',
              payload: { documentId: 'YOUR_DOCUMENT_ID', documentName: 'Service Agreement' },
            });
            console.log(result.summary);
        - lang: Python
          label: SDK
          source: |
